# 場所と危険情報の型（place_vs_risk）: 「危険と隣り合わせの観光地帯 パキスタン編」。
# 外務省の危険情報（パキスタン）: レベル4＝アフガニスタンとの国境周辺地帯・KP州の大部分・旧FATA・LoC等周辺地帯・クエッタ市／レベル3＝バロチスタン州ほか／レベル2＝イスラマバード首都圏・パンジャーブ州・シンド州・GB地域ほか。
# レベル3・4に近い人気の観光地として、ラホール（インド国境の近く）・タキシラ（KP州のすぐ南）・フンザ（アフガニスタン国境に近い谷）を見せる。
# 州・県の境界は Natural Earth（目安）。郡の単位（ノーシェラ郡・スワビ郡・ハザーラ地方の各郡など）、管理ライン（LoC）、アフガニスタン国境の周辺は、公式に範囲が書かれていないので、図を目安として塗る（画面と概要欄で明記）。
# 人気の根拠は ja / en の Wikipedia で照合し、写真は Commons のライセンスを確認する（src/facts.py）。
# 危険レベル・地域・理由の文言は、公式の危険情報ページの本文に出てくることを毎回自動で確かめる（src/mofa.py）。書き方は docs/THEME_SPEC.md「場所と危険情報」。

id: pakistan_place_risk
template: place_vs_risk

metric: 外務省の危険レベル
year: 2026
unit: レベル（1〜4）

source:
  name: 外務省 海外安全情報オープンデータ
  note: "（危険レベルは{asof}時点）"
  table: 海外安全情報オープンデータ 国別（country/0092.xml）と、パキスタンの危険情報ページ
  url: https://www.ezairyu.mofa.go.jp/html/opendata/index.html
  license:
    checked: 2026-10-13
    terms_url: https://www.ezairyu.mofa.go.jp/html/opendata/support/terms.html
    commercial: true
    credit_lines:
      - 外務省 海外安全情報オープンデータ 提供情報（https://www.ezairyu.mofa.go.jp/html/opendata/index.html）を加工して作成
      - 出典：外務省 海外安全情報オープンデータ（https://www.ezairyu.mofa.go.jp/html/opendata/index.html）（{asof}に利用）
      - 地域・危険の理由の文言：外務省 海外安全ホームページ パキスタンの危険情報（https://www.anzen.mofa.go.jp/）を要約
  fetch: mofa_risk

verification: >-
  危険レベルは外務省の国別XML（country/0092.xml）の値を、公式の危険情報ページ本文と照合して使う。
  画面の地域（レベル4: アフガニスタンとの国境周辺地帯・KP州ほか／レベル3: バロチスタン州ほか／レベル2: イスラマバード首都圏・パンジャーブ州・シンド州ほか）は、公式ページの「危険度」の節にその文言が出てきて、直後のレベル表示が一致することを毎回自動で確かめる。
  地域の注記と注意点の文言は、公式ページの本文にそのまま出てくることを確かめる。
  地図の範囲は概算: 州は Natural Earth の州境（目安）。郡の単位の地域（ノーシェラ郡・スワビ郡・チトラール郡、ハザーラ地方の各郡、ジャコババード郡）は、郡の位置を中心にした円。
  アフガニスタン国境の周辺・管理ライン（LoC）の周辺・クエッタ市は、公式に範囲の定めがないので、国境・線から約20〜30kmの帯、または市を中心にした円で示した目安。地図の線は国の境界を主張するものではなく、外務省の危険情報の地域を示す目安。
  観光地からレベル3・レベル4の地域までの距離は、座標とこの図形からの概算（5km単位）。
  観光地の根拠は、ja / en の Wikipedia の本文で確かめる（同じ Wikipedia の別言語版なので、独立した2系統とは言えない）。
  写真は Wikimedia Commons でライセンス（CC0 / パブリックドメイン / CC BY / CC BY-SA）と作者を確認し、画面と概要欄に出典を載せる。結果は build/pakistan_place_risk/fetch_report.txt。

mofa:
  max_age_hours: 24

