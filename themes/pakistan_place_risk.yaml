  description: >-
    パキスタンの人気の観光地、ムガル帝国の古都ラホール、世界遺産のタキシラ、桃源郷と呼ばれるフンザ。
    外務省の危険情報では、アフガニスタンとの国境周辺地帯・KP州の大部分・旧FATA・管理ライン（LoC）等周辺地帯・クエッタ市がレベル4（退避勧告）。バロチスタン州の大部分などがレベル3（渡航中止勧告）。イスラマバード首都圏、ラホール市を含むパンジャーブ州、カラチ市を含むシンド州、GB地域などはレベル2です。
    タキシラからレベル3の地域までは約{zone3_km_1}km、フンザからレベル4の地域までは約{zone4_km_2}km（地図上の概算）。
    外務省は、テロはレベル2の地域でも発生していること、全土で銃器を使った強盗などの犯罪やデモに注意が必要なことを伝えています。
    危険情報は国全体ではなく地域ごとに違います。地域と理由は、外務省の危険情報ページの記載を要約しました。渡航前には、必ず外務省の最新の情報を確認してください。
