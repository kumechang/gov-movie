# 場所と危険情報の型（place_vs_risk）: トルコ × イスタンブール。
# 「人気の街」の根拠（世界遺産・映画のロケ地・無形文化遺産・夜景の写真）を見せたあと、外務省の危険情報を地図で見比べる。
# 人気の根拠は Wikidata × ja.wikipedia で照合し、写真は Commons のライセンスを確認する（src/facts.py）。
# 危険レベル・地域・理由の文言は、公式の危険情報ページの本文に出てくることを毎回自動で確かめる（src/mofa.py）。書き方は docs/THEME_SPEC.md「場所と危険情報」。

id: turkey_place_risk
template: place_vs_risk

metric: 外務省の危険レベル
year: 2026
unit: レベル（1〜4）

source:
  name: 外務省 海外安全情報オープンデータ
  note: "（危険レベルは{asof}時点）"
  table: 海外安全情報オープンデータ 国別（country/0090.xml）と、トルコの危険情報ページ
  url: https://www.ezairyu.mofa.go.jp/html/opendata/index.html
  license:
    checked: 2026-10-13
    terms_url: https://www.ezairyu.mofa.go.jp/html/opendata/support/terms.html
    commercial: true
    credit_lines:
      - 外務省 海外安全情報オープンデータ 提供情報（https://www.ezairyu.mofa.go.jp/html/opendata/index.html）を加工して作成
      - 出典：外務省 海外安全情報オープンデータ（https://www.ezairyu.mofa.go.jp/html/opendata/index.html）（{asof}に利用）
      - 地域・危険の理由の文言：外務省 海外安全ホームページ トルコの危険情報（https://www.anzen.mofa.go.jp/）を要約
  fetch: mofa_risk

verification: >-
  危険レベルは外務省の国別XML（country/0090.xml）の値を、公式の危険情報ページ本文と照合して使う。
  画面の地域（シリアとの国境地帯・ディヤルバクル県及びイラクとの国境地帯・イスタンブール県）は、公式ページの「危険レベル」の節に
  その文言が出てきて、直後のレベル表示が一致することを毎回自動で確かめる。危険の理由・注意点の文言は、公式ページの本文にそのまま出てくることを確かめる。
  人気の根拠（世界遺産・無形文化遺産の登録年、映画のロケ地、公開年）は、Wikidata（CC0）の主張と ja.wikipedia の本文の両方で一致したものだけを使う。
  写真は Wikimedia Commons の API でライセンス（CC0 / パブリックドメイン / CC BY）と作者を確認し、画面と概要欄に出典を載せる。
  「夜景」の場面は写真の紹介だけで、人気や順位などの主張はしない。地図上の位置・範囲は、おおよその目安として画面に明記する。
  結果は build/turkey_place_risk/fetch_report.txt。

mofa:
  max_age_hours: 24

# ---------- 見た目 ----------
# style は本編（ターン以降）の恐怖演出。calm_style で、ターンの前（人気の場面）だけ落ち着いた色に差し替える。
style:
  look: horror
  fonts:
    Black: assets/fonts/KaiseiTokumin-ExtraBold.ttf
    Bold: assets/fonts/KaiseiTokumin-ExtraBold.ttf
    Accent: assets/fonts/YujiBoku-Regular.ttf
  bg: {top: [3, 0, 1], bottom: [28, 2, 5], fog: [120, 0, 12], fog_height: 0.38, vignette: 0.78, grain: 0.03}
  text: [238, 228, 222]
  muted: [168, 128, 128]
  accent: [226, 34, 44]
  title_color: [206, 18, 30]
  title_glow: [150, 0, 8]
  drips: [150, 0, 10]
  pill: {fill: [90, 0, 8, 130], outline: [200, 30, 40, 170], text: [240, 205, 205]}
  panel: {fill: [10, 0, 2, 234], outline: [190, 20, 30, 150], stroke: [0, 0, 0, 255]}
  bar: {bg: [52, 10, 14], fill: [204, 24, 36]}
  fx: {shake: 16, flash: [170, 0, 10], flash_alpha: 0.38, embers: true}
  named_colors:
    white: [238, 228, 222]
    yellow: [232, 188, 70]
    red: [226, 26, 38]
    muted: [168, 128, 128]

calm_style:
  bg: {top: [12, 22, 44], bottom: [34, 52, 88], vignette: 0.55, grain: 0.02}
  title_color: [244, 236, 224]
  title_glow: null
  drips: null
  pill: {fill: [255, 255, 255, 30], outline: [255, 255, 255, 80], text: [236, 232, 224]}

# ---------- 画面の固定文言 ----------
title: イスタンブール
title_small: トルコ｜人気の街と危険情報
subtitle: "外務省の危険情報と見比べる（{asof}時点）"
footnote: "危険情報の最終更新：{risk_date}｜地図の位置・範囲はおおよそです"

# ---------- 対象の国と、地図に出す地域 ----------
# regions[].where は公式ページの「危険レベル」の節の文言と照合される。bands は地図上のおおよその位置 [[経度,緯度],...]（点が1つなら円）。
members:
  - code: "0090"
    label: トルコ
    iso: TUR
    regions:
      - level: 4
        where: シリアとの国境地帯
        note: クルド系武装組織との衝突が散発的に発生しています
        bands:
          - [[36.2, 36.25], [36.8, 36.72], [37.8, 36.85], [38.9, 36.75], [40.0, 36.85], [41.2, 37.05], [42.3, 37.3]]
        width_km: 44
        label_at: [38.4, 35.35]
        say: "トルコ全体ではなく、シリアとの国境地帯が、レベル4。退避してください。"
      - level: 3
        where: ディヤルバクル県及びイラクとの国境地帯
        note: 治安当局を狙ったテロや治安当局とPKK（クルド労働者党）との衝突が発生しています
        bands:
          - [[40.23, 37.91]]
          - [[42.4, 37.3], [43.6, 37.2], [44.3, 37.55]]
        radius_km: 62
        width_km: 44
        label_at: [41.6, 38.95]
        say: "ディヤルバクル県と、イラクとの国境地帯は、レベル3。渡航は止めてください。"
      - level: 1
        where: イスタンブール県
        place: true
        say: "では、イスタンブールは？ イスタンブール県は、レベル1。十分注意してください。"
    why:
      - tag: テロ
        text: 2022年11月、タクシム広場の付近で爆弾テロ。6人が死亡
        evidence: イスティクラル通り（タクシム広場付近）において爆弾テロ事件（6名死亡）が発生
      - tag: テロ
        text: 最近でも、テロ事件が発生している
        evidence: 最近でもテロ事件が発生しています
      - tag: デモ・抗議
        text: デモや抗議活動が、突発的に行われることがある
        evidence: デモや抗議活動が突発的に行われることがあります

place:
  name: イスタンブール
  wikidata: Q406
  marker: [28.98, 41.01]

# ---------- 人気の根拠（Wikidata × ja.wikipedia で照合。photo.file は Commons のファイル名） ----------
scenes:
  - kind: heritage
    tag: 世界遺産
    name: イスタンブール歴史地域
    headline: 世界遺産の街並み
    lines: ["イスタンブール歴史地域", "1985年に世界遺産に登録"]
    wikidata: Q5773394
    designation: Q9259
    year: 1985
    wp_contains: [イスタンブール]
    source_line: 出典：UNESCO 世界遺産リスト（Wikidata・ja.Wikipedia で確認）
    photo: {file: "File:Hagia Sophia from Northwest, 2024.jpg"}
    say: "まず、街並み。イスタンブールの歴史地域は、1985年に、世界遺産に登録されました。"
  - kind: film
    tag: 映画のロケ地
    name: 映画のロケ地
    headline: 映画のロケ地
    lines: ["007 ロシアより愛をこめて（1963）", "007 スカイフォール（2012）", "アルゴ（2012）"]
    films:
      - {wikidata: Q106571, name: 007 ロシアより愛をこめて, year: 1963, places: [Q505954]}
      - {wikidata: Q4941, name: 007 スカイフォール, year: 2012}
      - {wikidata: Q59653, name: アルゴ, year: 2012}
    wp_contains: [イスタンブール]
    photo_note: 写真は、グランド・バザール（「ロシアより愛をこめて」の撮影場所）
    source_line: 出典：Wikidata（撮影場所）・ja.Wikipedia で確認
    photo: {file: "File:Grand Bazaar, Istanbul 5.jpg"}
    say: "映画のロケ地にも、なっています。ダブルオーセブン、ロシアより愛をこめて。スカイフォール。アルゴ。"
  - kind: ich
    tag: 無形文化遺産
    name: トルコ・コーヒーの文化と伝統
    headline: トルコ・コーヒー
    lines: ["トルココーヒーの文化と伝統", "2013年にユネスコの無形文化遺産に登録"]
    designation: ICH
    year: 2013
    wikipedia:
      - {lang: ja, title: トルココーヒー, contains: ["2013", 無形文化遺産]}
      - {lang: en, title: Turkish coffee, contains: ["2013", UNESCO]}
    source_line: 出典：UNESCO 無形文化遺産リスト（ja / en Wikipedia で確認）
    photo: {file: "File:Közde Türk Kahvesi, Safranbolu 2014.jpg"}
    say: "食べ物では、トルココーヒーの文化と伝統が、2013年に、ユネスコの無形文化遺産になりました。"
  - kind: night
    tag: 夜景
    name: イスタンブールの夜
    headline: イスタンブールの夜
    lines: ["ガラタ塔のある通り"]
    min: 4.5
    photo: {file: "File:Galata tower at night.jpg", must_mention: night}
    say: "そして夜は、ガラタ塔の見える、夜の街。"

# ---------- ターンと結び ----------
turn:
  say: "では、外務省の危険情報を、地図で見てみましょう。"
  lines:
    - ["ところが…", 130, red]
    - ["外務省の危険情報", 64, white]

caution:
  head: ただし
  say: "ただし、2022年11月には、タクシム広場の近くで、爆弾テロがあり、6人が亡くなっています。デモが、突発的に行われることもあります。"

closing:
  say: "危険情報は、国ではなく、地域ごとに違います。行く前に、外務省の最新の情報を確認してください。"
  lines:
    - ["レベルは地域ごと", 64, white]
    - ["出発前に必ず確認", 54, yellow]

extra_credits:
  - "人気の根拠：UNESCO 世界遺産・無形文化遺産リスト、映画の撮影場所（Wikidata（CC0）・ja.Wikipedia で確認）"

