# ---------- 投稿用テキスト（post.md として自動生成） ----------
post:
  title: "【{asof}時点】危険と隣り合わせの観光地帯。トルコ南東部の魅力と、外務省の危険情報"
  description: >-
    トルコと言えばイスタンブールが有名ですが、南東部には、ピスタチオと食文化で知られるガジアンテプ、世界遺産のギョベクリ・テペ（シャンルウルファ）、
    世界遺産のディヤルバクル城塞があります。ところが外務省の危険情報では、シリアとの国境地帯がレベル4、ディヤルバクル県及びイラクとの国境地帯がレベル3。
    ガジアンテプ・シャンルウルファはシリアに近く、県都以北はレベル1です。危険情報は国全体ではなく地域ごとに違います。地域と理由は、外務省の危険情報ページの記載を要約しました。
    渡航前には、必ず外務省の最新の情報を確認してください。
  pinned_comment: 次に見たい国は、どこですか？コメントで教えてください！
  hashtags: ["#トルコ", "#外務省", "#危険情報", "#海外旅行", "#世界遺産", "#ギョベクリテペ"]
