cta:
  say: "他の国も見たい人は、フォローしてね。気になる国は、コメントで教えてください。"
  panel:
    - [気になる国は？, 64, white, Black]
    - [コメントで教えてね ↓, 54, yellow, Black]

# ---------- 投稿用テキスト（post.md として自動生成） ----------
post:
  title: "【{asof}時点】世界遺産・映画のロケ地のイスタンブール。外務省の危険情報では？"
  description: >-
    トルコのイスタンブールは、世界遺産や映画のロケ地として知られる街です。外務省の危険情報を見ると、トルコには、シリアとの国境地帯（レベル4）や、
    ディヤルバクル県及びイラクとの国境地帯（レベル3）があります。一方、イスタンブール県はレベル1（十分注意してください）ですが、2022年にはテロ事件も起きています。
    危険情報は国全体ではなく地域ごとに違います。地域と理由は、外務省の危険情報ページの記載を要約しました。渡航前には、必ず外務省の最新の情報を確認してください。
  pinned_comment: 次に見たい国は、どこですか？コメントで教えてください！
  hashtags: ["#トルコ", "#イスタンブール", "#外務省", "#危険情報", "#海外旅行", "#世界遺産"]
