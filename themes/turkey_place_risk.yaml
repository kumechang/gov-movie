# 場所と危険情報の型（place_vs_risk）: 「危険と隣り合わせの観光地帯」（トルコ南東部）。
# 「トルコと言えばイスタンブールが有名ですが…」から入り、危険地域に近い観光地（ガジアンテプの食・ギョベクリ・テペ・ディヤルバクル城塞）の魅力を、
# 根拠（世界遺産・ユネスコの食文化の都市）つきで見せたあと、外務省の危険情報を地図で見比べる。
# 人気の根拠は Wikidata × ja.wikipedia で照合し、写真は Commons のライセンスを確認する（src/facts.py）。
# 危険レベル・地域・理由の文言は、公式の危険情報ページの本文に出てくることを毎回自動で確かめる（src/mofa.py）。書き方は docs/THEME_SPEC.md「場所と危険情報」。

id: turkey_place_risk
template: place_vs_risk

metric: 外務省の危険レベル
year: 2026
unit: レベル（1〜4）

source:
  name: 外務省 海外安全情報オープンデータ
  note: "（危険レベルは{asof}時点）"
  table: 海外安全情報オープンデータ 国別（country/0090.xml）と、トルコの危険情報ページ
  url: https://www.ezairyu.mofa.go.jp/html/opendata/index.html
  license:
    checked: 2026-10-13
    terms_url: https://www.ezairyu.mofa.go.jp/html/opendata/support/terms.html
    commercial: true
    credit_lines:
      - 外務省 海外安全情報オープンデータ 提供情報（https://www.ezairyu.mofa.go.jp/html/opendata/index.html）を加工して作成
      - 出典：外務省 海外安全情報オープンデータ（https://www.ezairyu.mofa.go.jp/html/opendata/index.html）（{asof}に利用）
      - 地域・危険の理由の文言：外務省 海外安全ホームページ トルコの危険情報（https://www.anzen.mofa.go.jp/）を要約
  fetch: mofa_risk

verification: >-
  危険レベルは外務省の国別XML（country/0090.xml）の値を、公式の危険情報ページ本文と照合して使う。
  画面の地域（シリアとの国境地帯・ディヤルバクル県及びイラクとの国境地帯・ガジアンテプ、シャンルウルファの県都以北）は、公式ページの「危険レベル」の節に
  その文言が出てきて、直後のレベル表示が一致することを毎回自動で確かめる。地域の注記の文言は、公式ページの本文にそのまま出てくることを確かめる。
  人気の根拠（世界遺産の登録年）は、Wikidata（CC0）の主張と ja.wikipedia の本文の両方で一致したものだけを使う。
  ガジアンテプの食文化（ピスタチオで有名・ユネスコの食文化の都市に2015年に指定）は、ja / en の Wikipedia の本文で確かめる（同じ Wikipedia の別言語版なので独立した2系統とは言えない。UNESCO の公式ページは自動取得できない）。
  写真は Wikimedia Commons でライセンス（CC0 / パブリックドメイン / CC BY）と作者を確認し、画面と概要欄に出典を載せる。
  「危険地帯と隣り合わせ」は、ディヤルバクルが危険レベル3の県の中にあること、ガジアンテプ・シャンルウルファがシリアに近く、危険レベル4のシリア国境地帯が地図上で近いことを指す。
  地図上の位置・範囲は、おおよその目安として画面に明記する。結果は build/turkey_place_risk/fetch_report.txt。

mofa:
  max_age_hours: 24

# ---------- 見た目 ----------
# style は本編（ターン以降）の恐怖演出。calm_style で、ターンの前（人気の場面）だけ落ち着いた色に差し替える。
style:
  look: horror
  fonts:
    Black: assets/fonts/KaiseiTokumin-ExtraBold.ttf
    Bold: assets/fonts/KaiseiTokumin-ExtraBold.ttf
    Accent: assets/fonts/YujiBoku-Regular.ttf
  bg: {top: [3, 0, 1], bottom: [28, 2, 5], fog: [120, 0, 12], fog_height: 0.38, vignette: 0.78, grain: 0.03}
  text: [238, 228, 222]
  muted: [168, 128, 128]
  accent: [226, 34, 44]
  title_color: [206, 18, 30]
  title_glow: [150, 0, 8]
  drips: [150, 0, 10]
  pill: {fill: [90, 0, 8, 130], outline: [200, 30, 40, 170], text: [240, 205, 205]}
  panel: {fill: [10, 0, 2, 234], outline: [190, 20, 30, 150], stroke: [0, 0, 0, 255]}
  bar: {bg: [52, 10, 14], fill: [204, 24, 36]}
  fx: {shake: 16, flash: [170, 0, 10], flash_alpha: 0.38, embers: true}
  named_colors:
    white: [238, 228, 222]
    yellow: [232, 188, 70]
    red: [226, 26, 38]
    muted: [168, 128, 128]

calm_style:
  bg: {top: [12, 22, 44], bottom: [34, 52, 88], vignette: 0.55, grain: 0.02}
  title_color: [244, 236, 224]
  title_glow: null
  drips: null
  pill: {fill: [255, 255, 255, 30], outline: [255, 255, 255, 80], text: [236, 232, 224]}

# ---------- 画面の固定文言 ----------
title: 危険と隣り合わせの観光地帯
title_small: トルコ編｜外務省の危険情報と見比べる
subtitle: "魅力と、危険情報の地域（{asof}時点）"
footnote: "危険情報の最終更新：{risk_date}｜地図の位置・範囲はおおよそです"

# 地図は、南東部だけを拡大して見せる（bbox = [経度の最小, 緯度の最小, 経度の最大, 緯度の最大]）
map:
  bbox: [34.0, 35.6, 45.0, 39.2]

# ---------- 対象の国と、地図に出す地域 ----------
# regions[].where は公式ページの「危険レベル」の節の文言と照合される。bands の有る地域は地図に描く危険地域（おおよその位置 [[経度,緯度],...]。点が1つなら円 radius_km、2点以上なら帯 width_km）。
# bands の無い地域は、人気の場所が属する地域のレベル（places から region で参照する。say が要る）。
members:
  - code: "0090"
    label: トルコ
    iso: TUR
    regions:
      - level: 4
        where: シリアとの国境地帯
        note: クルド系武装組織との衝突が散発的に発生しています
        bands:
          - [[36.2, 36.25], [36.8, 36.72], [37.8, 36.85], [38.9, 36.75], [40.0, 36.85], [41.2, 37.05], [42.3, 37.3]]
        width_km: 44
        label_at: [38.4, 35.9]
        say: "トルコ全体ではなく、シリアとの国境地帯が、レベル4。退避してください。ガジアンテプも、シャンルウルファも、すぐ近くです。"
      - level: 3
        where: ディヤルバクル県及びイラクとの国境地帯
        note: 治安当局を狙ったテロや治安当局とPKK（クルド労働者党）との衝突が発生しています
        place_note: 世界遺産ディヤルバクル城塞のある県です
        bands:
          - [[40.23, 37.91]]
          - [[42.4, 37.3], [43.6, 37.2], [44.3, 37.55]]
        radius_km: 62
        width_km: 44
        label_at: [43.0, 38.55]
        say: "そして、ディヤルバクル県と、イラクとの国境地帯は、レベル3。渡航は止めてください。世界遺産の城塞は、この県の中にあります。"
      - level: 1
        where: ガジアンテプ、シャンルウルファの県都以北
        display: ガジアンテプ県・シャンルウルファ県（県都以北）
        place_note: 食文化の創造都市と、世界遺産ギョベクリ・テペがある県です
        say: "ガジアンテプと、シャンルウルファは、シリアに近い県。県都以北は、レベル1です。"

# 人気の場所（地図に印を出す）。region（その地域のレベルがある）／in_region（危険地域の中）／absent（危険情報の地域に載っていない）。side は印のどちら側に名前を出すか。
places:
  - {name: ガジアンテプ, marker: [37.38, 37.07], region: ガジアンテプ、シャンルウルファの県都以北, side: left}
  - {name: シャンルウルファ, marker: [38.79, 37.16], region: ガジアンテプ、シャンルウルファの県都以北, side: above}
  - {name: ディヤルバクル, marker: [40.23, 37.91], in_region: ディヤルバクル県及びイラクとの国境地帯, side: above}

# ---------- 魅力の紹介（根拠は Wikidata × ja.wikipedia で照合。photo.file は Commons のファイル名） ----------
scenes:
  - kind: wikipedia
    tag: 食文化
    place: ガジアンテプ
    name: ガジアンテプ（ピスタチオ・食文化の都市）
    headline: ガジアンテプの食
    lines: ["ピスタチオで有名な街", "ユネスコの食文化の都市に2015年に指定"]
    wikipedia:
      - {lang: ja, title: ガズィアンテプ, contains: ["2015", ピスタチオ]}
      - {lang: en, title: Gaziantep, contains: ["2015", City of Gastronomy, UNESCO]}
    source_line: 出典：UNESCO City of Gastronomy（ja / en Wikipedia で確認）
    photo_note: 写真は、ピスタチオのバクラヴァ
    photo: {file: "File:Baklava sunumu.jpg"}
    min: 5.2
    say: "まず、ガジアンテプ。ピスタチオで、有名な街です。ユネスコの、食文化の都市にも、指定されています。"
  - kind: heritage
    tag: 世界遺産
    place: シャンルウルファ
    name: ギョベクリ・テペ
    headline: ギョベクリ・テペ
    lines: ["シャンルウルファ県の遺跡", "2018年に世界遺産に登録"]
    wikidata: Q214944
    designation: Q9259
    year: 2018
    wp_contains: [ギョベクリ]
    source_line: 出典：UNESCO 世界遺産リスト（Wikidata・ja.Wikipedia で確認）
    photo: {file: "File:Göbeklitepe 2015-21.jpg"}
    min: 5.0
    say: "次に、シャンルウルファの、ギョベクリ・テペ。2018年に、世界遺産になりました。"
  - kind: heritage
    tag: 世界遺産
    place: ディヤルバクル
    name: ディヤルバクル城塞とヘヴセル庭園の文化的景観
    headline: ディヤルバクル城塞
    lines: ["ディヤルバクル城塞とヘヴセル庭園の文化的景観", "2015年に世界遺産に登録"]
    wikidata: Q20963673
    wp_title: ディヤルバクル城塞とヘヴセル庭園の文化的景観
    designation: Q9259
    year: 2015
    wp_contains: [ディヤルバクル]
    source_line: 出典：UNESCO 世界遺産リスト（Wikidata・ja.Wikipedia で確認）
    photo: {file: "File:Walls of Diyarbakir - panoramio.jpg"}
    min: 5.0
    say: "そして、ディヤルバクル。黒い城壁の城塞も、2015年に、世界遺産になりました。"

# ---------- ターンと結び ----------
turn:
  say: "でも、この地域は、外務省が出している、危険地帯と、隣り合わせなんです。"
  lines:
    - ["でも…", 130, red]
    - ["危険地帯と隣り合わせ", 64, white]

closing:
  say: "魅力のある観光地が、危険な地域の、すぐ近くにあります。行く前に、外務省の最新の情報を、必ず確認してください。"
  lines:
    - ["隣り合わせの観光地帯", 58, white]
    - ["出発前に必ず確認", 54, yellow]

extra_credits:
  - "人気の根拠：UNESCO 世界遺産リスト・City of Gastronomy（Wikidata（CC0）・ja / en Wikipedia で確認）"

# ---------- 声 ----------
voice:
  vvm: [1]
  style_id: 14
  speed: 1.12
  pitch: -0.03
  intonation: 0.9
  credit: VOICEVOX:冥鳴ひまり

