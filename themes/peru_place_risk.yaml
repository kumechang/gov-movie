# ---------- 投稿用テキスト（post.md として自動生成） ----------
post:
  title: "【{asof}時点】危険と隣り合わせの観光地帯 ペルー編。アヤクーチョも、マチュピチュも、外務省のレベル3の近く"
  description: >-
    ペルーの人気の観光地、空中の遺跡マチュピチュ、インカの首都クスコ、独立戦争の街アヤクーチョ。
    外務省の危険情報では、フニン州・ワンカベリカ州・アヤクチョ州・クスコ州の一部（VRAEM地域）とロレト州プトゥマヨ郡がレベル3（渡航中止勧告）。上記以外の地域（リマ市を含む）はレベル1です。
    マチュピチュからレベル3の地域までは約{zone3_km_0}km、クスコからは約{zone3_km_1}km、アヤクーチョからは約{zone3_km_2}km（地図上の概算）。
    外務省は、主要な観光地で外国人旅行者を狙った強盗・スリ・ひったくりが頻発していること、抗議活動でマチュピチュへの鉄道が止まることもあることを伝えています。
    危険情報は国全体ではなく地域ごとに違います。地域と理由は、外務省の危険情報ページの記載を要約しました。渡航前には、必ず外務省の最新の情報を確認してください。
  pinned_comment: 次に見たい国は、どこですか？コメントで教えてください！
  hashtags: ["#危険と隣り合わせの観光地帯", "#ペルー", "#マチュピチュ", "#クスコ", "#アヤクーチョ", "#外務省", "#危険情報", "#海外旅行"]
