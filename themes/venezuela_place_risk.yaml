# ---------- 画面の固定文言 ----------
title: 危険と隣り合わせの観光地帯
title_small: ベネズエラ編｜外務省の危険情報と見比べる
subtitle: "魅力と、危険情報の地域（{asof}時点）"
footnote: "危険情報の最終更新：{risk_date}｜地図の位置・範囲はおおよそです"

# 地図: ベネズエラ西部（メリダ・タチラ）から、南東部（ギアナ高地）まで見せる（bbox = [経度の最小, 緯度の最小, 経度の最大, 緯度の最大]）
map:
  bbox: [-73.8, 4.0, -60.0, 11.4]


# ---------- 対象の国と、地図に出す地域 ----------
# provinces: Natural Earth の州の名前。border: 国境から km 以内の帯（隣国のリストでもよい）。rings: 座標の多角形。holes: 地域から抜く円 [経度, 緯度, 半径km]。
members:
  - code: "0058"
    label: ベネズエラ
    iso: VEN
    regions:
      - level: 3
        where: スクレ州の一部地域（パリア半島全域）
        display: スクレ州のパリア半島
        bands:
          - [[-63.3, 10.65], [-61.9, 10.72]]
        width_km: 35
        label_at: [-60.7, 10.9]
        say: "スクレ州の、パリア半島は、レベル3です。トリニダード・トバゴに近く、犯罪組織が、活動しているとされています。"
      - level: 3
        where: スリア州のマラカイボ市及び同州東部地域を除く地域、タチラ州、ボリバル州の一部地域（州北東部の「アルコ・ミネロ」鉱業地帯及びブラジルとの国境地帯）、アプレ州の一部地域（コロンビアとの国境地帯）及びアマゾナス州の一部地域（コロンビアとの国境地帯及びブラジルとの国境地帯）
        display: スリア州・タチラ州・国境地帯・アルコ・ミネロ
        provinces: [Zulia, Táchira]
        holes:
          - [-71.64, 10.64, 22]
          - [-71.2, 10.2, 45]
        border:
          - {with: COL, km: 25}
          - {with: BRA, km: 25}
        rings:
          - [[-64.9, 8.2], [-62.4, 8.75], [-61.2, 7.3], [-61.9, 6.35], [-64.0, 6.35], [-65.0, 7.2]]
        label_at: [-68.0, 5.0]
        note: 嘱託殺人、誘拐、麻薬、食料品密輸です
        say: "スリア州と、タチラ州、コロンビア、ブラジルとの、国境地帯、それに、ボリバル州の、鉱業地帯も、レベル3です。"
      - level: 2
        where: 上記以外の地域
        display: 上記以外の地域
        provinces: ['Amazonas', 'Anzoátegui', 'Apure', 'Aragua', 'Barinas', 'Bolívar', 'Carabobo', 'Cojedes', 'Delta Amacuro', 'Distrito Capital', 'Falcón', 'Guárico', 'Lara', 'Miranda', 'Monagas', 'Mérida', 'Nueva Esparta', 'Portuguesa', 'Sucre', 'Trujillo', 'Vargas', 'Yaracuy', 'Zulia', 'Táchira']
        label_at: [-66.5, 8.9]
        place_note: メリダと、エンジェルフォールは、この中です
        say: "上記以外は、レベル2です。メリダも、エンジェルフォールも、この中です。"
    why:
      - tag: 犯罪
        text: 銃を使った強盗が多く、制服の警察官・軍人が行う例も
        evidence: 制服を着た警察官、軍人が犯行を行う事例も増加傾向にあると言われています
      - tag: タクシー
        text: タクシーの運転手による強盗も。流しのタクシーは避ける
        evidence: 流しや客待ちのタクシーの利用は絶対に避けてください
      - tag: 注意
        text: デモや集会には、絶対に近づかない
        evidence: 反政府勢力や治安当局等との衝突に巻き込まれる可能性がありますので、絶対に近づかないようにしてください

# 人気の場所（地図に印を出す。座標は Wikipedia の位置。概算）。
places:
  - {name: メリダ, marker: [-71.1450, 8.5900], in_region: 上記以外の地域, side: above-left}
  - {name: エンジェルフォール, marker: [-62.5356, 5.9675], in_region: 上記以外の地域, side: left}
  - {name: ロライマ山, marker: [-60.7617, 5.1431], in_region: スリア州のマラカイボ市及び同州東部地域を除く地域、タチラ州、ボリバル州の一部地域（州北東部の「アルコ・ミネロ」鉱業地帯及びブラジルとの国境地帯）、アプレ州の一部地域（コロンビアとの国境地帯）及びアマゾナス州の一部地域（コロンビアとの国境地帯及びブラジルとの国境地帯）, side: below}

# ---------- 魅力の紹介（根拠は ja / en の Wikipedia で照合。photo.file は Commons のファイル名） ----------
scenes:
  - kind: wikipedia
    tag: ロープウェイ
    place: メリダ
    name: メリダ
    headline: メリダ
    lines: ["世界で最も高く、最も長いロープウェイ", "アンデスの谷にある、大学と観光の街", "レベル3の地域まで 約{zone3_km_0}km（地図上の概算）"]
    wikipedia:
      - {lang: ja, title: メリダ_(ベネズエラ), contains: [メリダ]}
