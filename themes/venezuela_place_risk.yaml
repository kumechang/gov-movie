    min: 7.5
    say: "そして、ロライマ山。標高二千八百十メートル、ベネズエラ、ブラジル、ガイアナの、三つの国境が、交わる台地です。でも、この山は、ブラジルとの、国境地帯で、レベル3の中です。"

# ---------- ターンと結び ----------
turn:
  say: "でも、この人気の観光地は、外務省が出している、危険地帯と、隣り合わせなんです。"
  lines:
    - ["でも…", 130, red]
    - ["危険地帯と隣り合わせ", 64, white]

caution:
  head: 外務省は、こう伝えています
  say: "外務省は、拳銃を使った強盗が、増えていて、警察官や軍人が、行う例もあると、伝えています。流しのタクシーは、避けること、デモや集会には、絶対に近づかないことを、求めています。"

closing:
  say: "有名な観光地の、近くに、レベル3の地域が、あります。ロライマ山は、レベル3の中、メリダと、エンジェルフォールは、レベル2です。行く前に、外務省の最新の情報を、必ず確認してください。"
  lines:
    - ["隣り合わせの観光地帯", 58, white]
    - ["出発前に必ず確認", 54, yellow]

extra_credits:
  - "人気の根拠：ja / en Wikipedia で確認"


