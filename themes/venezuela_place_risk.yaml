    source_line: 出典：ja / en Wikipedia で確認
    photo: {file: "File:Teleférico de Mérida estación pico espejo.jpg"}
    min: 8.0
    say: "まず、メリダ。世界で、最も高く、最も長い、ロープウェイが、ある街です。アンデスの谷にある、大学と、観光の街です。レベル3の地域まで、約{zone3_km_0}キロです。"
  - kind: wikipedia
    tag: 世界遺産
    place: エンジェルフォール
    name: エンジェルフォール
    headline: エンジェルフォール
    lines: ["世界最大の落差、979メートル", "ギアナ高地の台地から、流れ落ちる", "レベル3の地域まで 約{zone3_km_1}km（地図上の概算）"]
    wikipedia:
      - {lang: ja, title: エンジェルフォール, contains: [世界最大の落差, ギアナ高地]}
