# 場所と危険情報の型（place_vs_risk）: 「危険と隣り合わせの観光地帯 ベネズエラ編」。
# 外務省の危険情報（ベネズエラ）: レベル3＝スリア州（マラカイボ市と東部を除く）・タチラ州・ボリバル州の一部（アルコ・ミネロ鉱業地帯とブラジル国境地帯）・アプレ州とアマゾナス州の国境地帯・スクレ州パリア半島／レベル2＝上記以外。
# 2025年12月にレベル3に引き上げた地域は、2026年にレベル2に引き下げられた（公式ページの【ポイント】）。
# 観光地として、メリダ（ロープウェイ。タチラ州のレベル3の近く）・エンジェルフォール（カナイマ国立公園。レベル2）・ロライマ山（ブラジルとの国境地帯。レベル3の中）を見せる。
# 州の境界は Natural Earth。マラカイボ市と「スリア州東部地域」は範囲が書かれていないので、円で抜く（目安）。コロンビア・ブラジルとの国境地帯は国境から約25kmの帯（公式に範囲の定めがない。目安）。アルコ・ミネロは概算の多角形（目安）。パリア半島は座標の帯（目安）。
# 政治的な出来事（米軍の攻撃・大統領の拘束）は、この動画では扱わない。外務省の危険レベルと、地域・理由の文言だけを使う。
# 人気の根拠は ja / en の Wikipedia で照合し、写真は Commons のライセンスを確認する（src/facts.py）。
# 危険レベル・地域・理由の文言は、公式の危険情報ページの本文に出てくることを毎回自動で確かめる（src/mofa.py）。書き方は docs/THEME_SPEC.md「場所と危険情報」。

id: venezuela_place_risk
template: place_vs_risk

metric: 外務省の危険レベル
year: 2026
unit: レベル（1〜4）

source:
  name: 外務省 海外安全情報オープンデータ
  note: "（危険レベルは{asof}時点）"
  table: 海外安全情報オープンデータ 国別（country/0058.xml）と、ベネズエラの危険情報ページ
  url: https://www.ezairyu.mofa.go.jp/html/opendata/index.html
  license:
    checked: 2026-10-13
    terms_url: https://www.ezairyu.mofa.go.jp/html/opendata/support/terms.html
    commercial: true
    credit_lines:
      - 外務省 海外安全情報オープンデータ 提供情報（https://www.ezairyu.mofa.go.jp/html/opendata/index.html）を加工して作成
      - 出典：外務省 海外安全情報オープンデータ（https://www.ezairyu.mofa.go.jp/html/opendata/index.html）（{asof}に利用）
      - 地域・危険の理由の文言：外務省 海外安全ホームページ ベネズエラの危険情報（https://www.anzen.mofa.go.jp/）を要約
  fetch: mofa_risk

verification: >-
  危険レベルは外務省の国別XML（country/0058.xml）の値を、公式の危険情報ページ本文と照合して使う。
  画面の地域（レベル3: スリア州ほか多数の州の一部・パリア半島／レベル2: 上記以外）は、公式ページの「危険レベル」の節にその文言が出てきて、直後のレベル表示が一致することを毎回自動で確かめる。
  地域の注記と注意点の文言は、公式ページの本文にそのまま出てくることを確かめる。
  地図の範囲は概算: スリア州・タチラ州は Natural Earth の州境。マラカイボ市と「スリア州東部地域」は円で抜いた目安。コロンビア・ブラジルとの国境地帯は国境から約25kmの帯（公式に範囲の定めがない）。アルコ・ミネロは概算の多角形、パリア半島は座標の帯。地図の線は国境の主張ではない。
  観光地からレベル3の地域までの距離は、座標とこの図形からの概算（5km単位）。
  観光地の根拠は、ja / en の Wikipedia の本文で確かめる（同じ Wikipedia の別言語版なので、独立した2系統とは言えない）。
  写真は Wikimedia Commons でライセンス（CC0 / パブリックドメイン / CC BY / CC BY-SA）と作者を確認し、画面と概要欄に出典を載せる。結果は build/venezuela_place_risk/fetch_report.txt。

mofa:
  max_age_hours: 24


# ---------- 見た目 ----------
