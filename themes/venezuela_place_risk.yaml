# ---------- 投稿用テキスト（post.md として自動生成） ----------
post:
  title: "【{asof}時点】危険と隣り合わせの観光地帯 ベネズエラ編。ロライマ山は、外務省のレベル3の中"
  description: >-
    ベネズエラの人気の観光地、世界一のロープウェイのメリダ、世界最大の落差のエンジェルフォール、三国国境のロライマ山。
    外務省の危険情報では、スリア州（マラカイボ市と東部を除く）・タチラ州・ボリバル州の一部（アルコ・ミネロ鉱業地帯とブラジルとの国境地帯）・アプレ州とアマゾナス州の国境地帯・スクレ州のパリア半島がレベル3（渡航中止勧告）。上記以外の地域はレベル2です。
    メリダからレベル3の地域までは約{zone3_km_0}km、エンジェルフォールからは約{zone3_km_1}km（地図上の概算）。ロライマ山はブラジルとの国境地帯でレベル3の中です。
