  - {name: スリナガル, marker: [74.7973, 34.0837], in_region: ジャンム・カシミール準州スリナガル及びその近郊, side: below-left}
  - {name: レー, marker: [77.5770, 34.1526], in_region: ラダック連邦直轄領, side: below}

