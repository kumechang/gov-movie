# ---------- 画面の固定文言 ----------
title: 危険と隣り合わせの観光地帯
title_small: インド編｜外務省の危険情報と見比べる
subtitle: "魅力と、危険情報の地域（{asof}時点）"
footnote: "危険情報の最終更新：{risk_date}｜地図の位置・範囲はおおよそです"

# 地図: インド北部（ジャンム・カシミール準州・ラダック連邦直轄領・パンジャーブ州）を見せる（bbox = [経度の最小, 緯度の最小, 経度の最大, 緯度の最大]）
map:
  bbox: [72.6, 30.2, 79.8, 35.8]


# ---------- 対象の国と、地図に出す地域 ----------
# provinces: Natural Earth の州の名前。bands（2点以上）＋ width_km: 線の帯。bands（1点）＋ radius_km: 円。holes: 地域から抜く円 [経度, 緯度, 半径km]。
members:
  - code: "0091"
    label: インド
    iso: IND
    regions:
      - level: 4
        where: 管理ライン（LoC）付近
        display: 管理ライン（LoC）付近
        bands:
          - [[74.4, 32.55], [74.15, 32.95], [74.05, 33.45], [73.8, 33.85], [73.75, 34.35], [74.25, 34.65], [74.85, 34.7], [75.6, 34.6], [76.1, 34.6], [76.4, 35.0], [77.0, 35.45]]
        width_km: 30
        clip: true
        label_at: [73.0, 33.2]
        note: 管理ライン付近において両軍間での銃撃戦などが継続的に発生しています
        say: "管理ライン、LoCの付近は、レベル4。退避してください。渡航は、止めてください。"
      - level: 3
        where: ジャンム・カシミール準州（スリナガル及びその近郊、管理ライン(LoC)付近、ラダック連邦直轄領を除く地域）
        display: ジャンム・カシミール準州
        provinces: [Jammu and Kashmir]
        holes:
          - [74.80, 34.08, 25]
        label_at: [75.0, 33.0]
        note: 爆弾テロや、インド軍・治安当局との銃撃戦が頻発し
        say: "ジャンム・カシミール準州は、レベル3。どのような目的でも、渡航は止めてください。"
      - level: 2
        where: ジャンム・カシミール準州スリナガル及びその近郊
        display: スリナガルとその近郊
        bands:
          - [[74.80, 34.08]]
        radius_km: 25
        label_at: [74.6, 34.9]
        say: "ただし、スリナガルと、その近郊だけは、レベル2です。周りは、レベル3です。"
      - level: 1
        where: ラダック連邦直轄領
        display: ラダック連邦直轄領
        provinces: [Ladakh]
        label_at: [79.0, 33.0]
        say: "ラダック連邦直轄領は、レベル1です。"
      - level: 1
        where: 上記以外のインド全域（デリー、コルカタ、チェンナイ、ムンバイ、ベンガルールなどの大都市を含む地域）
        display: 上記以外のインド全域（デリーなど）
        place_note: アムリトサルは、この中です
        say: "アムリトサルを含む、上記以外のインド全域は、レベル1です。"
    why:
      - tag: テロ
        text: 分離独立などを掲げる過激派が、各地でテロ活動
        evidence: 各地でテロ活動を行っています
      - tag: 犯罪
        text: 観光地で、窃盗・詐欺・睡眠薬強盗などが頻発
        evidence: 都市部や観光地を中心に、窃盗、詐欺や睡眠薬を用いた強盗・強姦などの犯罪が頻発しています
      - tag: 注意
        text: スリナガルとレーは、陸路を避け、空路で
        evidence: レーを訪問する際は、陸路での移動を避け、空路を利用してください

