# 場所と危険情報の型（place_vs_risk）: 「危険と隣り合わせの観光地帯 インド編」。
# 外務省の危険情報（インド）: レベル4＝ジャンム・カシミール準州・ラダックの管理ライン（LoC）付近／レベル3＝ジャンム・カシミール準州（スリナガル及びその近郊・LoC付近・ラダックを除く）／レベル2＝スリナガル及びその近郊／レベル1＝ラダック連邦直轄領・上記以外のインド全域（デリーなど）。
# 近くにレベル3・4がある人気の観光地として、アムリトサル（黄金寺院。レベル1。パキスタンのラホールまで約50km）・スリナガル（ダル湖。レベル2だが、周りはレベル3）・レー（ラダック。レベル1）を見せる。
# 州の境界は Natural Earth（目安）。スリナガルの「近郊」の範囲、LoC「付近」の範囲は公式に書かれていないので、図を目安として塗る（画面と概要欄で明記）。地図の線は国の境界を主張するものではなく、外務省の危険情報の地域を示す目安。
# 北東部諸州（レベル2）・中東部（レベル2）は、この回の地図の範囲の外なので図には出さない。
# 人気の根拠は ja / en の Wikipedia で照合し、写真は Commons のライセンスを確認する（src/facts.py）。
# 危険レベル・地域・理由の文言は、公式の危険情報ページの本文に出てくることを毎回自動で確かめる（src/mofa.py）。書き方は docs/THEME_SPEC.md「場所と危険情報」。

id: india_place_risk
template: place_vs_risk

metric: 外務省の危険レベル
year: 2026
unit: レベル（1〜4）

source:
  name: 外務省 海外安全情報オープンデータ
  note: "（危険レベルは{asof}時点）"
  table: 海外安全情報オープンデータ 国別（country/0091.xml）と、インドの危険情報ページ
  url: https://www.ezairyu.mofa.go.jp/html/opendata/index.html
  license:
    checked: 2026-10-13
    terms_url: https://www.ezairyu.mofa.go.jp/html/opendata/support/terms.html
    commercial: true
    credit_lines:
      - 外務省 海外安全情報オープンデータ 提供情報（https://www.ezairyu.mofa.go.jp/html/opendata/index.html）を加工して作成
      - 出典：外務省 海外安全情報オープンデータ（https://www.ezairyu.mofa.go.jp/html/opendata/index.html）（{asof}に利用）
      - 地域・危険の理由の文言：外務省 海外安全ホームページ インドの危険情報（https://www.anzen.mofa.go.jp/）を要約
  fetch: mofa_risk

verification: >-
  危険レベルは外務省の国別XML（country/0091.xml）の値を、公式の危険情報ページ本文と照合して使う。
  画面の地域（レベル4: 管理ライン（LoC）付近／レベル3: ジャンム・カシミール準州（スリナガル及びその近郊、LoC付近、ラダック連邦直轄領を除く地域）／レベル2: スリナガル及びその近郊／レベル1: ラダック連邦直轄領・上記以外のインド全域）は、公式ページの「危険レベル」の節にその文言が出てきて、直後のレベル表示が一致することを毎回自動で確かめる。
  地域の注記と注意点の文言は、公式ページの本文にそのまま出てくることを確かめる。
  地図の範囲は概算: 州・準州は Natural Earth の境界（目安）。スリナガルの近郊は、市の位置を中心にした円（公式に範囲の定めがない）。管理ライン（LoC）付近は、線の周辺の幅約30kmの帯（目安。公式に範囲の定めがない）。
  観光地からレベル3・レベル4の地域までの距離は、座標とこの図形からの概算（5km単位）。
  観光地の根拠は、ja / en の Wikipedia の本文で確かめる（同じ Wikipedia の別言語版なので、独立した2系統とは言えない）。
  写真は Wikimedia Commons でライセンス（CC0 / パブリックドメイン / CC BY）と作者を確認し、画面と概要欄に出典を載せる。結果は build/india_place_risk/fetch_report.txt。

mofa:
  max_age_hours: 24


