# ---------- ターンと結び ----------
turn:
  say: "でも、この人気の観光地は、外務省が出している、危険地帯と、隣り合わせなんです。"
  lines:
    - ["でも…", 130, red]
    - ["危険地帯と隣り合わせ", 64, white]

caution:
  head: 外務省は、こう伝えています
  say: "外務省は、各地で、テロ活動が行われていると、伝えています。観光地を中心に、窃盗や詐欺、睡眠薬を使った強盗なども、頻発しています。スリナガルや、レーを訪ねるときは、陸路を避け、空路を使うよう、求めています。"

closing:
  say: "人気の観光地の、すぐ近くに、レベル3と、レベル4が、あります。スリナガルは、レベル2、レーと、アムリトサルは、レベル1です。行く前に、外務省の最新の情報を、必ず確認してください。"
  lines:
    - ["隣り合わせの観光地帯", 58, white]
    - ["出発前に必ず確認", 54, yellow]

extra_credits:
