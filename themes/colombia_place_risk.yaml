# 場所と危険情報の型（place_vs_risk）: 「危険と隣り合わせの観光地帯 コロンビア編」。
# 外務省の危険情報（コロンビア）: レベル3＝アラウカ県・カウカ県西部・ナリーニョ県西部・ノルテ・デ・サンタンデル県北部／レベル2＝多数の県（メタ県・バジェ・デル・カウカ県・ベネズエラ国境付近など）／レベル1＝メタ県カニョ・クリスタレス地区周辺と上記以外。
# 観光地として、カルタヘナ（レベル1）・コーヒー文化的景観（レベル1。バジェ・デル・カウカ県のレベル2のすぐ隣）・カニョ・クリスタレス（レベル2のメタ県の中で、ここだけレベル1）を見せる。
# 県の境界は Natural Earth。「西部」「東部」「北部」「南部」は範囲が書かれていないので、県を緯度で切るか、円で示す目安。レベル2のうち、ラ・グアヒラ県・ビチャダ県・グアイニア県のベネズエラ国境付近、アリアリ地域などは、この回の図に出さない。
# 人気の根拠は ja / en の Wikipedia で照合し、写真は Commons のライセンスを確認する（src/facts.py）。
# 危険レベル・地域・理由の文言は、公式の危険情報ページの本文に出てくることを毎回自動で確かめる（src/mofa.py）。書き方は docs/THEME_SPEC.md「場所と危険情報」。

id: colombia_place_risk
template: place_vs_risk

metric: 外務省の危険レベル
year: 2026
unit: レベル（1〜4）

source:
  name: 外務省 海外安全情報オープンデータ
  note: "（危険レベルは{asof}時点）"
  table: 海外安全情報オープンデータ 国別（country/0057.xml）と、コロンビアの危険情報ページ
  url: https://www.ezairyu.mofa.go.jp/html/opendata/index.html
  license:
    checked: 2026-10-13
    terms_url: https://www.ezairyu.mofa.go.jp/html/opendata/support/terms.html
    commercial: true
    credit_lines:
      - 外務省 海外安全情報オープンデータ 提供情報（https://www.ezairyu.mofa.go.jp/html/opendata/index.html）を加工して作成
      - 出典：外務省 海外安全情報オープンデータ（https://www.ezairyu.mofa.go.jp/html/opendata/index.html）（{asof}に利用）
      - 地域・危険の理由の文言：外務省 海外安全ホームページ コロンビアの危険情報（https://www.anzen.mofa.go.jp/）を要約
  fetch: mofa_risk

verification: >-
  危険レベルは外務省の国別XML（country/0057.xml）の値を、公式の危険情報ページ本文と照合して使う。
  画面の地域（レベル3: アラウカ県・カウカ県西部・ナリーニョ県西部・ノルテ・デ・サンタンデル県北部／レベル2: 多数の県／レベル1: カニョ・クリスタレス地区周辺と上記以外）は、公式ページの「危険レベル」の節にその文言が出てきて、直後のレベル表示が一致することを毎回自動で確かめる。
  地図の範囲は概算: アラウカ県などは Natural Earth の県境。「西部」「東部」は円、「北部」「南部」は県を緯度で切った目安。カニョ・クリスタレスは円（半径20km）。ベネズエラ国境付近・アリアリ地域などは、この回の図に出さない。
  観光地からレベル2の地域までの距離は、座標とこの図形からの概算（5km単位）。
  地域の注記と注意点の文言は、公式ページの本文にそのまま出てくることを確かめる。
  観光地の根拠は、ja / en の Wikipedia の本文で確かめる（同じ Wikipedia の別言語版なので、独立した2系統とは言えない）。
  写真は Wikimedia Commons でライセンス（CC0 / パブリックドメイン / CC BY / CC BY-SA）と作者を確認し、画面と概要欄に出典を載せる。結果は build/colombia_place_risk/fetch_report.txt。

mofa:
  max_age_hours: 24


