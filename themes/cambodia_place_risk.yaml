# ---------- 投稿用テキスト（post.md として自動生成） ----------
post:
  title: "【{asof}時点】危険と隣り合わせの観光地帯 カンボジア編。世界遺産と、タイ国境の危険情報"
  description: >-
    カンボジアの世界遺産、アンコール、コー・ケー、プレアヴィヒア寺院。ところが外務省の危険情報では、タイとの国境から30km以内はレベル3（渡航中止勧告）、
    30kmを越えて50km以内はレベル2。プレアヴィヒア寺院は国境のすぐ近くで、レベル3の範囲内です。アンコールとコー・ケーは「上記以外の全土」でレベル1ですが、
    外務省は、国境から80km近い地域での攻撃例も報告されたと伝えています。就労目的の勧誘にも注意が必要です。
    危険情報は国全体ではなく地域ごとに違います。地域と理由は、外務省の危険情報ページの記載を要約しました。渡航前には、必ず外務省の最新の情報を確認してください。
  pinned_comment: 次に見たい国は、どこですか？コメントで教えてください！
  hashtags: ["#危険と隣り合わせの観光地帯", "#カンボジア", "#アンコールワット", "#プレアヴィヒア寺院", "#世界遺産", "#外務省", "#危険情報", "#海外旅行"]
