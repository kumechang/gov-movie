# ---------- ターンと結び ----------
turn:
  say: "でも、この地域は、外務省が出している、危険地帯と、隣り合わせなんです。"
  lines:
    - ["でも…", 130, red]
    - ["危険地帯と隣り合わせ", 64, white]

caution:
  head: 外務省は、こう伝えています
  say: "外務省は、国境付近で、両国軍の衝突があったと伝えています。また、好条件の仕事と誘われて、監禁される事案にも、注意を呼びかけています。"

closing:
  say: "世界遺産の寺院が、危険な地域の、すぐそばにあります。行く前に、外務省の最新の情報を、必ず確認してください。"
  lines:
