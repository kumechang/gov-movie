# 場所と危険情報の型（place_vs_risk）: 「危険と隣り合わせの観光地帯 ミャンマー編」。
# 外務省の危険情報（ミャンマー）: レベル3＝ラカイン州北部・チン州パレワ地区・シャン州コーカン自治地帯・カチン州ライザー周辺・カレン州ミヤワディ地区・戒厳令が発令された63地区／レベル2＝上記以外の地域。
# 戒厳令の地区に近い人気の観光地として、バガン（マグウェ地域の戒厳令の地区が約30km）・マンダレー（コンバウン朝の最後の都）・パアン（カレン州の州都）を見せる。
# 州の境界は Natural Earth（目安）。戒厳令の地区は郡（地区）の単位で、境界のデータが無いので、地区の中心の位置の円（半径20km、目安）で、観光地に近いものだけを図示する（63地区のすべてではない。画面にも書く）。
# 地図の線は国の境界を主張するものではなく、外務省の危険情報の地域を示す目安。
# 人気の根拠は ja / en の Wikipedia で照合し、写真は Commons のライセンスを確認する（src/facts.py）。
# 危険レベル・地域・理由の文言は、公式の危険情報ページの本文に出てくることを毎回自動で確かめる（src/mofa.py）。書き方は docs/THEME_SPEC.md「場所と危険情報」。
# このページはレベルの見出し（●レベル3：）のあとに地域を並べる書き方なので、直前の見出しのレベルで確かめる（mofa.where_is_faithful）。

id: myanmar_place_risk
template: place_vs_risk

metric: 外務省の危険レベル
year: 2026
unit: レベル（1〜4）

source:
  name: 外務省 海外安全情報オープンデータ
  note: "（危険レベルは{asof}時点）"
  table: 海外安全情報オープンデータ 国別（country/0095.xml）と、ミャンマーの危険情報ページ
  url: https://www.ezairyu.mofa.go.jp/html/opendata/index.html
  license:
    checked: 2026-10-13
    terms_url: https://www.ezairyu.mofa.go.jp/html/opendata/support/terms.html
    commercial: true
    credit_lines:
      - 外務省 海外安全情報オープンデータ 提供情報（https://www.ezairyu.mofa.go.jp/html/opendata/index.html）を加工して作成
      - 出典：外務省 海外安全情報オープンデータ（https://www.ezairyu.mofa.go.jp/html/opendata/index.html）（{asof}に利用）
      - 地域・危険の理由の文言：外務省 海外安全ホームページ ミャンマーの危険情報（https://www.anzen.mofa.go.jp/）を要約
  fetch: mofa_risk

verification: >-
  危険レベルは外務省の国別XML（country/0095.xml）の値を、公式の危険情報ページ本文と照合して使う。
  画面の地域（レベル3: ラカイン州北部・チン州パレワ地区、シャン州コーカン自治地帯、カチン州ライザー周辺、カレン州ミヤワディ地区、戒厳令が発令された63地区／レベル2: 上記以外）は、公式ページの「危険レベル」の節に、その見出し（●レベル3：）のあとの項目として出てくることを毎回自動で確かめる。
  地域の注記と注意点の文言は、公式ページの本文にそのまま出てくることを確かめる。
  地図の範囲は概算: 州は Natural Earth の州境（目安）。ラカイン州北部は州を緯度で切った目安。ミヤワディ地区は、町の位置を中心にした円（公式に範囲の定めがない）。シャン州のコーカン自治地帯・カチン州のライザー周辺（どちらもレベル3）は、この回の地図の範囲の外なので、図には出さない。
  戒厳令が発令された63地区は、境界のデータが無いので、観光地に近い地区だけを、地区の中心の位置の円（半径20km）で図示した（63地区のすべてではない）。
  観光地からレベル3の地域までの距離は、座標とこの図形からの概算（5km単位）。
  観光地の根拠は、ja / en の Wikipedia の本文で確かめる（同じ Wikipedia の別言語版なので、独立した2系統とは言えない）。
  写真は Wikimedia Commons でライセンス（CC0 / パブリックドメイン / CC BY）と作者を確認し、画面と概要欄に出典を載せる。結果は build/myanmar_place_risk/fetch_report.txt。

mofa:
  max_age_hours: 24


