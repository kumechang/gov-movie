    min: 8.0
    say: "まず、ケルアン。北アフリカの、マッカと呼ばれた、聖地です。グランド・モスクで知られる、世界遺産です。レベル3の地域まで、約{zone3_km_0}キロです。"
  - kind: wikipedia
    tag: 島
    place: ジェルバ島
    name: ジェルバ島
    headline: ジェルバ島
    lines: ["オデュッセウスが上陸したと伝わる島", "ユダヤ人が、古くから暮らしてきた", "リビア国境まで 約{border_km_1}km（地図上の概算）"]
    wikipedia:
      - {lang: ja, title: ジェルバ島, contains: [オデュッセウス, ユダヤ人, シナゴーグ]}
      - {lang: en, title: Djerba, contains: [Odysseus]}
    source_line: 出典：ja / en Wikipedia で確認
    photo: {file: "File:Traditional Weaving Workshops in Houmt Souk, Djerba.jpg"}
    min: 8.0
    say: "次に、ジェルバ島。オデュッセウスが、上陸したと、伝わる島です。ユダヤ人が、古くから、暮らしてきました。リビアとの、国境まで、約{border_km_1}キロです。"
  - kind: wikipedia
    tag: ローマ遺跡
    place: ドゥッガ
    name: ドゥッガ
    headline: ドゥッガ
    lines: ["ローマ時代の劇場や神殿が残る、世界遺産", "1997年に登録", "レベル2の地域まで 約{zone2_km_2}km（地図上の概算）"]
    wikipedia:
      - {lang: en, title: Dougga, contains: [UNESCO, "Roman theatre"]}
      - {lang: en, title: List of World Heritage Sites in Tunisia, contains: [Dougga]}
    source_line: 出典：en Wikipedia で確認（ja 版は記述が少ない。外務省の文言は公式ページ）
