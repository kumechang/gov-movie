# ---------- 投稿用テキスト（post.md として自動生成） ----------
post:
  title: "【{asof}時点】危険と隣り合わせの観光地帯 チュニジア編。ケルアン・ジェルバ島・ドゥッガと、外務省のレベル2・3の地域の距離"
  description: >-
    チュニジアの人気の観光地、聖都ケルアン、ジェルバ島、ローマ遺跡ドゥッガ。
    外務省の危険情報では、西部の山岳地帯・ガフサ県オルバタ山付近・アルジェリア・リビア国境付近・南部軍事緩衝地帯がレベル3（渡航中止勧告）。ジャンドゥーバ県・ル・ケフ県などがレベル2。上記以外の地域はレベル1です。
    ケルアンからレベル3の地域までは約{zone3_km_0}km、ジェルバ島からリビア国境までは約{border_km_1}km、ドゥッガからレベル2の地域までは約{zone2_km_2}km（地図上の概算）。
