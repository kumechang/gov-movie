# ---------- 画面の固定文言 ----------
title: 危険と隣り合わせの観光地帯
title_small: チュニジア編｜外務省の危険情報と見比べる
subtitle: "魅力と、危険情報の地域（{asof}時点）"
footnote: "危険情報の最終更新：{risk_date}｜地図の位置・範囲はおおよそです"

# 地図: チュニジア全体（北部の遺跡から、南のジェルバ島・軍事緩衝地帯まで）を見せる（bbox = [経度の最小, 緯度の最小, 経度の最大, 緯度の最大]）
map:
  bbox: [7.4, 31.0, 11.9, 37.5]


# ---------- 対象の国と、地図に出す地域 ----------
# provinces: Natural Earth の県。provinces_clip: 県の北部・南部だけ。bands（1点）＋ radius_km: 円。
members:
  - code: "0216"
    label: チュニジア
    iso: TUN
    regions:
      - level: 3
        where: カスリン県及びシディ・ブ・ジッド県の山岳地帯（シャアンビ山、セルーン山、ムギラ山、スメナ山、オルバタ山付近）
        display: 西部の山岳地帯（カスリン県・シディ・ブ・ジッド県）
        bands:
          - [[8.68, 35.19]]
          - [[8.85, 35.0]]
        radius_km: 28
        note: 地元住民がテロ組織により埋設された地雷で死傷する事件が発生しています
        label_at: [7.7, 34.6]
        say: "カスリン県と、シディ・ブ・ジッド県の、山岳地帯は、レベル3です。テロ組織が、潜伏しているとされる、地域です。"
      - level: 3
        where: ガフサ県の山岳地帯（オルバタ山付近）、アルジェリア・リビア国境付近及び南部軍事緩衝地帯
        display: オルバタ山付近・南部軍事緩衝地帯
        provinces_clip:
          - {name: Tataouine, lat_max: 32.2}
        bands:
          - [[8.95, 34.45]]
        radius_km: 20
        label_at: [8.0, 32.4]
        say: "ガフサ県の、オルバタ山付近と、南部の、軍事緩衝地帯も、レベル3です。"
      - level: 2
        where: ジャンドゥーバ県（レベル3の地域、国道17号線以東、タバルカ市内、アイン・ドラハム市内及びジャンドゥーバ市内を除く）、ル・ケフ県（レベル3の地域、国道17号線以東及びル・ケフ市内を除く）及び南部砂漠地帯の一部（ジュビル国立公園、ボルジュ・ブルギバ、ルマダ、タタウィン、ザルジスの各都市を除くそれより南方の一部地域で、レベル3以外の地域）
        display: ジャンドゥーバ県・ル・ケフ県ほか
        provinces: [Jendouba, "Le Kef"]
        label_at: [7.7, 36.5]
        say: "北西部の、ジャンドゥーバ県と、ル・ケフ県は、レベル2です。"
      - level: 1
        where: 上記以外の地域
        display: 上記以外の地域
        place_note: 3つとも、この中です
        say: "ケルアン、ジェルバ島、ドゥッガは、レベル1です。"
    why:
      - tag: テロ
        text: 2015年、バルドー博物館襲撃で、日本人3人を含む22人が死亡
        evidence: 2015年3月のバルドー国立博物館襲撃テロ事件では日本人3人を含む22人が死亡しました
      - tag: 地雷
        text: 西部の山岳地帯では、地雷で住民が死傷
        evidence: 地元住民がテロ組織により埋設された地雷で死傷する事件が発生しています
      - tag: 注意
        text: レベル1の地域でも、テロや一般犯罪のおそれ
        evidence: テロ事件が発生する可能性は排除されず、また、一般犯罪の被害にあう等トラブルに巻き込まれる可能性もありますので

# 人気の場所（地図に印を出す。座標は Wikipedia の位置。概算）。
places:
  - {name: ケルアン, marker: [10.0963, 35.6781], region: 上記以外の地域, side: right}
  - {name: ジェルバ島, marker: [10.8572, 33.8760], border_with: LBY, region: 上記以外の地域, side: right}
  - {name: ドゥッガ, marker: [9.2203, 36.4233], region: 上記以外の地域, side: above-right}

# ---------- 魅力の紹介（根拠は ja / en の Wikipedia で照合。photo.file は Commons のファイル名） ----------
scenes:
  - kind: wikipedia
    tag: 聖都
    place: ケルアン
    name: ケルアン
    headline: ケルアン
    lines: ["「北アフリカのマッカ」と呼ばれた聖地", "グランド・モスクで知られる世界遺産", "レベル3の地域まで 約{zone3_km_0}km（地図上の概算）"]
    wikipedia:
      - {lang: ja, title: ケルアン, contains: [北アフリカのマッカ, グランド・モスク, アグラブ朝]}
      - {lang: en, title: Kairouan, contains: [UNESCO]}
    source_line: 出典：ja / en Wikipedia で確認
