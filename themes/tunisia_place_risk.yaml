# 場所と危険情報の型（place_vs_risk）: 「危険と隣り合わせの観光地帯 チュニジア編」。
# 外務省の危険情報（チュニジア）: レベル3＝西部の山岳地帯（シャアンビ山ほか）・ガフサ県オルバタ山付近・アルジェリア・リビア国境付近・南部軍事緩衝地帯／レベル2＝ジャンドゥーバ県・ル・ケフ県・南部砂漠地帯の一部／レベル1＝上記以外。
# 観光地として、ケルアン（聖都）・ジェルバ島・ドゥッガ（ローマ遺跡）を見せる（どれもレベル1）。
# 県の境界は Natural Earth。山岳地帯は山の位置の円、南部軍事緩衝地帯はタタウィン県を緯度で切った目安。レベル2・3の国境付近、国道・市内の例外は、図に出せない（細かいため）。
# 人気の根拠は ja / en の Wikipedia で照合し、写真は Commons のライセンスを確認する（src/facts.py）。
# 危険レベル・地域・理由の文言は、公式の危険情報ページの本文に出てくることを毎回自動で確かめる（src/mofa.py）。書き方は docs/THEME_SPEC.md「場所と危険情報」。

id: tunisia_place_risk
template: place_vs_risk

metric: 外務省の危険レベル
year: 2026
unit: レベル（1〜4）

source:
  name: 外務省 海外安全情報オープンデータ
  note: "（危険レベルは{asof}時点）"
  table: 海外安全情報オープンデータ 国別（country/0216.xml）と、チュニジアの危険情報ページ
  url: https://www.ezairyu.mofa.go.jp/html/opendata/index.html
  license:
    checked: 2026-10-13
    terms_url: https://www.ezairyu.mofa.go.jp/html/opendata/support/terms.html
    commercial: true
    credit_lines:
      - 外務省 海外安全情報オープンデータ 提供情報（https://www.ezairyu.mofa.go.jp/html/opendata/index.html）を加工して作成
      - 出典：外務省 海外安全情報オープンデータ（https://www.ezairyu.mofa.go.jp/html/opendata/index.html）（{asof}に利用）
      - 地域・危険の理由の文言：外務省 海外安全ホームページ チュニジアの危険情報（https://www.anzen.mofa.go.jp/）を要約
  fetch: mofa_risk

verification: >-
  危険レベルは外務省の国別XML（country/0216.xml）の値を、公式の危険情報ページ本文と照合して使う。
  画面の地域（レベル3: 西部の山岳地帯・オルバタ山付近・南部軍事緩衝地帯／レベル2: ジャンドゥーバ県・ル・ケフ県ほか／レベル1: 上記以外）は、公式ページの「危険レベル」の節にその文言が出てきて、直後のレベル表示が一致することを毎回自動で確かめる。
  地図の範囲は概算: 山岳地帯は山の位置の円（半径22〜30km）。南部軍事緩衝地帯はタタウィン県を北緯32.2度より南で切った目安。ジャンドゥーバ県・ル・ケフ県は県全体で塗った目安（国道・市内の例外は図に出さない）。
  観光地からレベル3の地域までの距離は、座標とこの図形からの概算（5km単位）。ジェルバ島は、リビア国境までの距離（座標と国境線）で言う。
  地域の注記と注意点の文言は、公式ページの本文にそのまま出てくることを確かめる。
  観光地の根拠は、ja / en の Wikipedia の本文で確かめる（同じ Wikipedia の別言語版なので、独立した2系統とは言えない）。
  写真は Wikimedia Commons でライセンス（CC0 / パブリックドメイン / CC BY / CC BY-SA）と作者を確認し、画面と概要欄に出典を載せる。結果は build/tunisia_place_risk/fetch_report.txt。

mofa:
  max_age_hours: 24


# ---------- 見た目 ----------
