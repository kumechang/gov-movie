    say: "そして、ドゥッガ。ローマ時代の、劇場や、神殿が残る、世界遺産です。千九百九十七年に、登録されました。レベル2の地域まで、約{zone2_km_2}キロです。"

# ---------- ターンと結び ----------
turn:
  say: "でも、この人気の観光地は、外務省が出している、危険地帯と、隣り合わせなんです。"
  lines:
    - ["でも…", 130, red]
    - ["危険地帯と隣り合わせ", 64, white]

caution:
  head: 外務省は、こう伝えています
  say: "外務省は、二千十五年に、バルドー国立博物館が、襲撃され、日本人三人を含む、二十二人が、亡くなったと、伝えています。西部の山岳地帯では、地雷で、住民が、死傷する事件も、起きています。"

closing:
  say: "人気の観光地の、近くに、レベル2と、レベル3の地域が、あります。ケルアン、ジェルバ島、ドゥッガは、レベル1です。行く前に、外務省の最新の情報を、必ず確認してください。"
  lines:
    - ["隣り合わせの観光地帯", 58, white]
    - ["出発前に必ず確認", 54, yellow]

extra_credits:
  - "人気の根拠：ja / en Wikipedia で確認（ドゥッガは en のみ）"


