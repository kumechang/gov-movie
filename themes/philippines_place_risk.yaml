# 場所と危険情報の型（place_vs_risk）: 「危険と隣り合わせの観光地帯 フィリピン編」。
# ミンダナオ島のカミギン島・ダバオ・ジェネラル・サントス（いずれも外務省がレベル1の例外として名前を挙げている場所）の魅力を、根拠つきで見せたあと、
# 周りのレベル3・レベル2の地域（州の単位）を、Natural Earth の州の境界から地図に塗って見比べる（src/world.py の admin1_rings）。
# 人気の根拠は ja / en の Wikipedia で照合し、写真は Commons のライセンスを確認する（src/facts.py）。
# 危険レベル・地域・理由の文言は、公式の危険情報ページの本文に出てくることを毎回自動で確かめる（src/mofa.py）。書き方は docs/THEME_SPEC.md「場所と危険情報」。

id: philippines_place_risk
template: place_vs_risk

metric: 外務省の危険レベル
year: 2026
unit: レベル（1〜4）

source:
  name: 外務省 海外安全情報オープンデータ
  note: "（危険レベルは{asof}時点）"
  table: 海外安全情報オープンデータ 国別（country/0063.xml）と、フィリピンの危険情報ページ
  url: https://www.ezairyu.mofa.go.jp/html/opendata/index.html
  license:
    checked: 2026-10-13
    terms_url: https://www.ezairyu.mofa.go.jp/html/opendata/support/terms.html
    commercial: true
    credit_lines:
      - 外務省 海外安全情報オープンデータ 提供情報（https://www.ezairyu.mofa.go.jp/html/opendata/index.html）を加工して作成
      - 出典：外務省 海外安全情報オープンデータ（https://www.ezairyu.mofa.go.jp/html/opendata/index.html）（{asof}に利用）
      - 地域・危険の理由の文言：外務省 海外安全ホームページ フィリピンの危険情報（https://www.anzen.mofa.go.jp/）を要約
  fetch: mofa_risk

verification: >-
  危険レベルは外務省の国別XML（country/0063.xml）の値を、公式の危険情報ページ本文と照合して使う。
  画面の地域（レベル3: ミンダナオ地方の一部の州ほか／レベル2／レベル1の例外: カミギン州・ダバオ市・ジェネラル・サントス市など）は、公式ページの「危険度」の節に
  その文言が出てきて、直後のレベル表示が一致することを毎回自動で確かめる。地域の注記と注意点の文言は、公式ページの本文にそのまま出てくることを確かめる。
  地図の塗り分けは、Natural Earth 10m の州・県の境界（目安）から。サランガニ州西部の3町（マアシム・キアンバ・マイトゥム）は、位置を円で示す概算。
  シアルガオ島・スリガオ市は、レベル1の例外として、レベル2の地域から抜いてある（位置と大きさは概算）。
  観光地の魅力（ダバオに日本人街があったこと、ジェネラル・サントスがマグロの街であること、カミギン島に火山があること）は、ja / en の Wikipedia の本文で確かめる
  （同じ Wikipedia の別言語版なので、独立した2系統とは言えない）。
  写真は Wikimedia Commons でライセンス（CC0 / パブリックドメイン / CC BY）と作者を確認し、画面と概要欄に出典を載せる。
  地図上の位置・範囲は、おおよその目安として画面に明記する。結果は build/philippines_place_risk/fetch_report.txt。

mofa:
  max_age_hours: 24

