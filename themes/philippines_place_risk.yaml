# ---------- 投稿用テキスト（post.md として自動生成） ----------
post:
  title: "【{asof}時点】危険と隣り合わせの観光地帯 フィリピン編。ダバオ・ジェネラル・サントス・カミギン島と、ミンダナオの危険情報"
  description: >-
    フィリピンのミンダナオ島には、火山と白い砂州のカミギン島、戦前に日本人街があったダバオ、マグロの街ジェネラル・サントスがあります。
    外務省の危険情報では、いずれも「レベル1」の例外として名前が挙がっていますが、周りには、レベル3（渡航中止勧告）の州（サンボアンガ、ラナオ、コタバトなど）と、
    レベル2（ブキドノン、南コタバトなど）の地域があります。レベル3の地域では、爆弾テロや身代金目的の誘拐が多発していると外務省は伝えています。
    危険情報は国全体ではなく地域ごとに違います。地域と理由は、外務省の危険情報ページの記載を要約しました。渡航前には、必ず外務省の最新の情報を確認してください。
  pinned_comment: 次に見たい国は、どこですか？コメントで教えてください！
  hashtags: ["#危険と隣り合わせの観光地帯", "#フィリピン", "#ミンダナオ", "#ダバオ", "#外務省", "#危険情報", "#海外旅行"]
