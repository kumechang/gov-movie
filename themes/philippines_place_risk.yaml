title: 危険と隣り合わせの観光地帯
title_small: フィリピン編｜外務省の危険情報と見比べる
subtitle: "魅力と、危険情報の地域（{asof}時点）"
footnote: "危険情報の最終更新：{risk_date}｜地図の位置・範囲はおおよそです"

# 地図は、ミンダナオ島を拡大して見せる（bbox = [経度の最小, 緯度の最小, 経度の最大, 緯度の最大]）
map:
  bbox: [119.6, 4.6, 127.4, 10.3]

# ---------- 対象の国と、地図に出す地域 ----------
# provinces: Natural Earth の州・県の英語名（その州全体を塗る）。bands の点（1つ）＋ radius_km は、町の位置を示す円。holes は、地域から抜く例外（[経度, 緯度, 半径km]）。
members:
  - code: "0063"
    label: フィリピン
    iso: PHL
    regions:
      - level: 3
        where: 北サンボアンガ州、南サンボアンガ州、サンボアンガ・シブガイ州、北ラナオ州、西ミサミス州、コタバト州、スルタン・クダラット州
        display: サンボアンガ・ラナオなど
        provinces: [Zamboanga, Zamboanga del Norte, Zamboanga del Sur, Zamboanga Sibugay, Lanao del Norte, Iligan, Lanao del Sur, Misamis Occidental, Cotabato, Sultan Kudarat, Maguindanao, Basilan, Sulu, Tawi-Tawi]
        bands:
          - [[125.0, 5.87]]
          - [[124.63, 5.98]]
          - [[124.47, 6.03]]
        radius_km: 16
        note: イスラム過激派組織による爆弾テロ事件や身代金目的の誘拐事件等が多発する
        label_at: [122.4, 7.0]
        say: "ミンダナオ島の、サンボアンガや、ラナオ、コタバトなどの州は、レベル3。渡航は止めてください。"
      - level: 2
        where: ブキドノン州、南コタバト州、北スリガオ州（スリガオ市及びシャルガオ島を除く）、南スリガオ州、北アグサン州、南アグサン州
        display: ブキドノン・南コタバトなど
        provinces: [Bukidnon, South Cotabato, Sarangani, Surigao del Norte, Surigao del Sur, Agusan del Norte, Agusan del Sur]
        holes:
          - [126.08, 9.82, 28]
          - [125.49, 9.79, 9]
          - [125.17, 6.11, 20]
        label_at: [126.2, 8.35]
        say: "その東と、南の、ブキドノンや、南コタバトなどは、レベル2です。"
      - level: 1
        where: カミギン州、東ミサミス州カガヤン・デ・オロ市、ハサアン町、ビリャヌエバ町及びタゴロアン町、東ダバオ州マティ市、北ダバオ州タグム市及びサマール市、南ダバオ州ダバオ市及びディゴス市、南コタバト州ジェネラル・サントス市、北スリガオ州シャルガオ島
        display: カミギン・ダバオ・ジェネラル・サントス
        place_where: カミギン州、南ダバオ州ダバオ市、南コタバト州ジェネラル・サントス市ほか
        place_note: レベル2・3の地域の近くにある観光地です
        say: "でも、カミギン島と、ダバオ市と、ジェネラル・サントス市は、レベル1。レベル2と3の地域の、すぐ近くにあります。"
    why:
      - tag: テロ
        text: イスラム過激派組織による爆弾テロや、身代金目的の誘拐が多発
        evidence: イスラム過激派組織による爆弾テロ事件や身代金目的の誘拐事件等が多発する
      - tag: 誘拐
        text: 外国人を狙った、身代金目的の誘拐
        evidence: 身代金目的の外国人誘拐
      - tag: 注意
        text: 非常事態宣言の解除後も、テロや誘拐は、依然発生している
        evidence: テロや誘拐が依然発生しているため、引き続き渡航の際には最新情報に基づく注意が必要です

