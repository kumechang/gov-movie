    tag: 国境の町
    place: アランヤプラテート
    name: アランヤプラテート
    headline: アランヤプラテート
    lines: ["バンコクとアンコールを結ぶ道の、国境の町", "巨大な国境市場もある", "カンボジア国境まで 約{border_km_0}km（地図上の概算）"]
