# 場所と危険情報の型（place_vs_risk）: 「危険と隣り合わせの観光地帯 タイ編」。
# バンコク・パッタヤー（人気の観光地。外務省の危険レベルの地域に載っていない）と、バンコクからアンコールへ向かう陸路の町アランヤプラテート（カンボジア国境から6km。レベル3の範囲内）を、
# 根拠つきで見せたあと、カンボジア国境から30km以内（レベル3）と30kmを越えて50km以内（レベル2）を、国境線のデータから地図に描いて見比べる。
# 人気の根拠は ja / en の Wikipedia で照合し、写真は Commons のライセンスを確認する（src/facts.py）。
# 危険レベル・地域・理由の文言は、公式の危険情報ページの本文に出てくることを毎回自動で確かめる（src/mofa.py）。書き方は docs/THEME_SPEC.md「場所と危険情報」。

id: thailand_place_risk
template: place_vs_risk

metric: 外務省の危険レベル
year: 2026
unit: レベル（1〜4）

source:
  name: 外務省 海外安全情報オープンデータ
  note: "（危険レベルは{asof}時点）"
  table: 海外安全情報オープンデータ 国別（country/0066.xml）と、タイの危険情報ページ
  url: https://www.ezairyu.mofa.go.jp/html/opendata/index.html
  license:
    checked: 2026-10-13
    terms_url: https://www.ezairyu.mofa.go.jp/html/opendata/support/terms.html
    commercial: true
    credit_lines:
      - 外務省 海外安全情報オープンデータ 提供情報（https://www.ezairyu.mofa.go.jp/html/opendata/index.html）を加工して作成
      - 出典：外務省 海外安全情報オープンデータ（https://www.ezairyu.mofa.go.jp/html/opendata/index.html）（{asof}に利用）
      - 地域・危険の理由の文言：外務省 海外安全ホームページ タイの危険情報（https://www.anzen.mofa.go.jp/）を要約
  fetch: mofa_risk

verification: >-
  危険レベルは外務省の国別XML（country/0066.xml）の値を、公式の危険情報ページ本文と照合して使う。
  画面の地域（レベル3: カンボジア国境から30km以内／レベル2: 30kmを越えて50km以内）は、公式ページの「危険レベル」の節にその文言が出てきて、直後のレベル表示が一致することを毎回自動で確かめる。
  地域の注記と注意点の文言は、公式ページの本文にそのまま出てくることを確かめる。国境線は Natural Earth の国境線（目安）から30km・50kmの帯を計算する。
  バンコク・パッタヤーが「危険レベルの節に載っていない」ことは、節に地名が出てこないことで確かめる。アランヤプラテートが30km以内にあることは、座標と国境線から計算して確かめる（外れると動画が作れない）。
  タイ南端（マレーシア国境付近）のレベル3・2は、地図には描かず、注意点として、公式ページの文言のまま伝える。
  観光地の根拠（バンコクが首都であること、パッタヤーが海辺の街であること、アランヤプラテートがバンコクとシェムリアップを結ぶ道の国境の町であること）は、ja / en の Wikipedia の本文で確かめる
  （同じ Wikipedia の別言語版なので、独立した2系統とは言えない）。
  写真は Wikimedia Commons でライセンス（CC0 / パブリックドメイン / CC BY）と作者を確認し、画面と概要欄に出典を載せる。
  地図上の位置・範囲は、おおよその目安として画面に明記する。結果は build/thailand_place_risk/fetch_report.txt。

mofa:
  max_age_hours: 24

# ---------- 見た目 ----------
# style は本編（ターン以降）の恐怖演出。calm_style で、ターンの前（人気の場面）だけ落ち着いた色に差し替える。
style:
  look: horror
  fonts:
    Black: assets/fonts/KaiseiTokumin-ExtraBold.ttf
    Bold: assets/fonts/KaiseiTokumin-ExtraBold.ttf
    Accent: assets/fonts/YujiBoku-Regular.ttf
  bg: {top: [3, 0, 1], bottom: [28, 2, 5], fog: [120, 0, 12], fog_height: 0.38, vignette: 0.78, grain: 0.03}
  text: [238, 228, 222]
  muted: [168, 128, 128]
  accent: [226, 34, 44]
  title_color: [206, 18, 30]
  title_glow: [150, 0, 8]
  drips: [150, 0, 10]
  pill: {fill: [90, 0, 8, 130], outline: [200, 30, 40, 170], text: [240, 205, 205]}
  panel: {fill: [10, 0, 2, 234], outline: [190, 20, 30, 150], stroke: [0, 0, 0, 255]}
  bar: {bg: [52, 10, 14], fill: [204, 24, 36]}
  fx: {shake: 16, flash: [170, 0, 10], flash_alpha: 0.38, embers: true}
  named_colors:
    white: [238, 228, 222]
    yellow: [232, 188, 70]
    red: [226, 26, 38]
    muted: [168, 128, 128]

calm_style:
  bg: {top: [12, 22, 44], bottom: [34, 52, 88], vignette: 0.55, grain: 0.02}
  title_color: [244, 236, 224]
  title_glow: null
  drips: null
  pill: {fill: [255, 255, 255, 30], outline: [255, 255, 255, 80], text: [236, 232, 224]}

# ---------- 画面の固定文言 ----------
title: 危険と隣り合わせの観光地帯
title_small: タイ編｜外務省の危険情報と見比べる
subtitle: "魅力と、危険情報の地域（{asof}時点）"
footnote: "危険情報の最終更新：{risk_date}｜地図の位置・範囲はおおよそです"

# 地図は、タイ東部（バンコク・パッタヤーと、カンボジア国境の地域）を見せる（bbox = [経度の最小, 緯度の最小, 経度の最大, 緯度の最大]）
map:
  bbox: [99.6, 11.9, 105.7, 15.0]

# ---------- 対象の国と、地図に出す地域 ----------
# border: 「国境から○km以内」の地域は、国境線のデータから帯を作る（with は相手の国の ISO3 コード。km は国境からの距離）。
members:
  - code: "0066"
    label: タイ
    iso: THA
    regions:
      - level: 3
        where: カンボジアとの国境付近（シーサケート県、スリン県、ブリラム県、ウボンラチャタニ県サケーオ県、チャンタブリ県、トラート県のカンボジア国境から30km以内）
        display: 国境から30km以内
        border: {with: KHM, km: 30}
        note: 国境に近い地域（カンボジア国境から30km以内）では、今後も不測の事態が発生する可能性が否定できない
        place_note: アンコールへの道の町は、この中です
        label_at: [104.5, 14.35]
        say: "カンボジアとの国境から、30キロ以内は、レベル3。渡航は止めてください。アランヤプラテートは、この中にあります。"
      - level: 2
        where: カンボジアとの国境付近（シーサケート県、スリン県、ブリラム県、ウボンラチャタニ県サケーオ県、チャンタブリ県、トラート県のカンボジア国境から30kmを超えて50km以内の地域）
        display: 国境30km超〜50km以内
        border: {with: KHM, km: 50}
        label_at: [103.9, 12.5]
        say: "その外側、50キロまでは、レベル2です。"
    absent_places:
      - {place: バンコク, names: [バンコク]}
      - {place: パッタヤー, names: [パッタヤー, パタヤ, チョンブリ]}
    why:
      - tag: 紛争・武力衝突
        text: 2025年7月以降、カンボジア国境付近で両国軍が衝突
        evidence: カンボジアとの国境付近において、タイ・カンボジア両国軍による軍事衝突が発生して以降
      - tag: 事件
        text: 南端のマレーシア国境付近では、襲撃・爆発事件が頻発
        evidence: 分離独立を標榜するイスラム武装勢力による襲撃・爆発事件が頻発している
      - tag: 監禁・強制労働
        text: 好条件の仕事と誘われた日本人が、監禁される事案
        evidence: 好条件の仕事があるとして勧誘された日本人が監禁状態に置かれ不法行為に強制的に従事させられる事案が発生しています

# 人気の場所（地図に印を出す。座標は Wikipedia・Wikidata の位置。概算）。
places:
  - {name: バンコク, marker: [100.5018, 13.7563], absent: true, side: below}
  - {name: パッタヤー, marker: [100.8825, 12.9236], absent: true, side: right}
  - {name: アランヤプラテート, marker: [102.5, 13.69], in_region: カンボジアとの国境付近（シーサケート県、スリン県、ブリラム県、ウボンラチャタニ県サケーオ県、チャンタブリ県、トラート県のカンボジア国境から30km以内）, side: above}

# バンコクから、レベル3の地域までの距離（国境線と座標から計算した概算）
distance:
  from: バンコク
  level: 3
  round: 10
  say: "バンコクから、レベル3の地域までは、直線で、約{dist_km}キロです。"

others:
  say: "バンコクと、パッタヤーは、外務省の危険レベルの地域に、載っていません。"

# ---------- 魅力の紹介（根拠は ja / en の Wikipedia で照合。photo.file は Commons のファイル名） ----------
scenes:
  - kind: wikipedia
    tag: 首都
    place: バンコク
    name: バンコク
    headline: バンコク
    lines: ["タイの首都", "ワット・アルンなど、寺院が多い"]
    wikipedia:
      - {lang: ja, title: バンコク, contains: [首都, ワット・アルン]}
      - {lang: en, title: Bangkok, contains: [capital, Wat Arun]}
    source_line: 出典：ja / en Wikipedia で確認
    photo: {file: "File:Phra Prang Wat Arun during day.jpg"}
    min: 5.0
    say: "まず、バンコク。タイの首都で、ワット・アルンなど、寺院が、たくさんあります。"
  - kind: wikipedia
    tag: 海辺の街
    place: パッタヤー
    name: パッタヤー
    headline: パッタヤー
    lines: ["バンコクから近い、海辺の街", "ビーチと、にぎやかな街並み"]
    wikipedia:
      - {lang: ja, title: パッタヤー, contains: [ビーチ, バンコク]}
      - {lang: en, title: Pattaya, contains: [beach, Bangkok]}
    source_line: 出典：ja / en Wikipedia で確認
    photo: {file: "File:Pattaya Beach, Pattaya Bay, Thailand.jpg"}
    min: 5.0
    say: "次に、パッタヤー。バンコクから近い、海辺の街です。"
  - kind: wikipedia
    tag: 国境の町
    place: アランヤプラテート
    name: アランヤプラテート
    headline: アランヤプラテート
    lines: ["バンコクとアンコールを結ぶ道の、国境の町", "カンボジア国境まで 約{border_km_2}km（地図上の概算）"]
    wikipedia:
      - {lang: ja, title: アランヤプラテート郡, contains: [国境, アンコール]}
      - {lang: en, title: Aranyaprathet, contains: [Bangkok, Siem Reap, Angkor Wat]}
    source_line: 出典：ja / en Wikipedia で確認
    photo_note: 写真は、アランヤプラテートの、タイ側の国境ゲート
    photo: {file: "File:Привет Королевство Таиланд - panoramio.jpg"}
    min: 5.4
    say: "そして、アランヤプラテート。バンコクから、アンコールへ向かう道の、国境の町です。カンボジアとの国境まで、約{border_km_2}キロです。"

# ---------- ターンと結び ----------
turn:
  say: "でも、タイにも、外務省が出している、危険地帯が、あるんです。"
  lines:
    - ["でも…", 130, red]
    - ["タイにも危険地帯", 64, white]

caution:
  head: 外務省は、こう伝えています
  say: "外務省は、2025年7月以降、カンボジアとの国境付近で、両国軍の衝突があったと伝えています。南の端の、マレーシア国境付近でも、襲撃や爆発事件が、頻発しています。また、好条件の仕事と誘われた日本人が、監禁される事案にも、注意を呼びかけています。"

closing:
  say: "バンコクや、パッタヤーは、載っていません。でも、アンコールへ向かう道の町は、レベル3の中です。行く前に、外務省の最新の情報を、必ず確認してください。"
  lines:
    - ["隣り合わせの観光地帯", 58, white]
    - ["出発前に必ず確認", 54, yellow]

extra_credits:
  - "人気の根拠：ja / en Wikipedia で確認"

# ---------- 声 ----------
voice:
  vvm: [1]
  style_id: 14
  speed: 1.12
  pitch: -0.03
  intonation: 0.9
  credit: VOICEVOX:冥鳴ひまり

