    say: "そして、パノム・ルン。もう噴火しない、火山の縁に建つ、クメールの寺院です。十世紀から、十三世紀に、栄えた、と考えられています。国境まで、約{border_km_2}キロ。レベル3の、境目のあたりです。"

# ---------- ターンと結び ----------
turn:
  say: "でも、この遺跡の近くは、外務省が出している、危険地帯と、隣り合わせなんです。"
  lines:
    - ["でも…", 130, red]
    - ["危険地帯と隣り合わせ", 64, white]

caution:
  head: 外務省は、こう伝えています
  say: "外務省は、2025年7月以降、カンボジアとの国境付近で、両国軍の衝突があったと伝えています。南の端の、マレーシア国境付近でも、襲撃や爆発事件が、頻発しています。また、好条件の仕事と誘われた日本人が、監禁される事案にも、注意を呼びかけています。"

closing:
  say: "バンコクから、アンコールへ向かう道の町も、クメールの遺跡も、国境の、すぐ近くです。30キロの線の、ほんの少し外側でも、レベル2です。行く前に、外務省の最新の情報を、必ず確認してください。"
  lines:
    - ["隣り合わせの観光地帯", 58, white]
    - ["出発前に必ず確認", 54, yellow]

extra_credits:
