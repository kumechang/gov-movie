# 場所と危険情報の型（place_vs_risk）: 「危険と隣り合わせの観光地帯 タイ編」（2026-10-15 作り直し）。
# カンボジア国境から30km以内（レベル3）・30kmを越えて50km以内（レベル2）を、国境線のデータから地図に描き、国境に近い観光地（アランヤプラテート・スドック・コック・トム・パノム・ルン）を、
# 根拠つきで見せて見比べる。国境までの距離は、Wikipedia の座標と国境線から計算した概算（5km単位）。
# 人気の根拠は ja / en の Wikipedia で照合し（スドック・コック・トム・パノム・ルンは ja 版に項目が無いため en のみ）、写真は Commons のライセンスを確認する（src/facts.py）。
# 危険レベル・地域・理由の文言は、公式の危険情報ページの本文に出てくることを毎回自動で確かめる（src/mofa.py）。書き方は docs/THEME_SPEC.md「場所と危険情報」。

id: thailand_place_risk
template: place_vs_risk

metric: 外務省の危険レベル
year: 2026
unit: レベル（1〜4）

source:
  name: 外務省 海外安全情報オープンデータ
  note: "（危険レベルは{asof}時点）"
  table: 海外安全情報オープンデータ 国別（country/0066.xml）と、タイの危険情報ページ
  url: https://www.ezairyu.mofa.go.jp/html/opendata/index.html
  license:
    checked: 2026-10-13
    terms_url: https://www.ezairyu.mofa.go.jp/html/opendata/support/terms.html
    commercial: true
    credit_lines:
      - 外務省 海外安全情報オープンデータ 提供情報（https://www.ezairyu.mofa.go.jp/html/opendata/index.html）を加工して作成
      - 出典：外務省 海外安全情報オープンデータ（https://www.ezairyu.mofa.go.jp/html/opendata/index.html）（{asof}に利用）
      - 地域・危険の理由の文言：外務省 海外安全ホームページ タイの危険情報（https://www.anzen.mofa.go.jp/）を要約
  fetch: mofa_risk

verification: >-
  危険レベルは外務省の国別XML（country/0066.xml）の値を、公式の危険情報ページ本文と照合して使う。
  画面の地域（レベル3: カンボジア国境から30km以内／レベル2: 30kmを越えて50km以内）は、公式ページの「危険レベル」の節にその文言が出てきて、直後のレベル表示が一致することを毎回自動で確かめる。
  地域の注記と注意点の文言は、公式ページの本文にそのまま出てくることを確かめる。国境線は Natural Earth の国境線（目安）から30km・50kmの帯を計算する。
  観光地の国境までの距離は、Wikipedia の座標と国境線からの概算（5km単位）。アランヤプラテートとスドック・コック・トムは30km以内、パノム・ルンは30kmを越えて50km以内、と計算で確かめる（外れると動画が作れない）。
  ただし、座標と国境線の誤差があるので、30kmの線の近く（パノム・ルン約32km）は、「境目のあたり」と伝え、画面にも「地図上の概算」と明記する。
  タイ南端（マレーシア国境付近）のレベル3・2は、地図には描かず、注意点として、公式ページの文言のまま伝える。
  観光地の根拠は、ja / en の Wikipedia の本文で確かめる（スドック・コック・トム・パノム・ルンは ja 版に項目が無いため en のみ。同じ Wikipedia の別言語版なので、独立した2系統とは言えない）。
  写真は Wikimedia Commons でライセンス（CC0 / パブリックドメイン / CC BY）と作者を確認し、画面と概要欄に出典を載せる。結果は build/thailand_place_risk/fetch_report.txt。

mofa:
  max_age_hours: 24

