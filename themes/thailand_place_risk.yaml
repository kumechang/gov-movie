cta:
  say: "世界の意外な、旅行リスクを、地図と、公的情報で、解説しています。次の地域も、紹介します。フォローしてね。気になる国は、コメントで教えてください。"
  panel:
    - [世界の意外な旅行リスクを, 46, white, Bold]
