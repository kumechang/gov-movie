# ---------- 投稿用テキスト（post.md として自動生成） ----------
post:
  title: "【{asof}時点】危険と隣り合わせの観光地帯 タイ編。バンコクからアンコールへ向かう道の町は、外務省のレベル3"
  description: >-
    タイの首都バンコクや、海辺の街パッタヤーは、外務省の危険情報の地域に載っていません。
    でも、バンコクからアンコールワットのあるシェムリアップへ向かう道の国境の町、アランヤプラテートは、カンボジア国境から約5km（地図上の概算）。
    外務省の危険情報では、カンボジア国境から30km以内はレベル3（渡航中止勧告）、30kmを越えて50km以内はレベル2です。
    2025年7月以降、国境付近で両国軍の衝突がありました。タイ南端のマレーシア国境付近でも、襲撃・爆発事件が頻発していると外務省は伝えています。
    また、タイで好条件の仕事と誘われた日本人が監禁される事案も、外務省が注意を呼びかけています。
    危険情報は国全体ではなく地域ごとに違います。地域と理由は、外務省の危険情報ページの記載を要約しました。渡航前には、必ず外務省の最新の情報を確認してください。
  pinned_comment: 次に見たい国は、どこですか？コメントで教えてください！
  hashtags: ["#危険と隣り合わせの観光地帯", "#タイ", "#バンコク", "#パタヤ", "#アンコールワット", "#外務省", "#危険情報", "#海外旅行"]
