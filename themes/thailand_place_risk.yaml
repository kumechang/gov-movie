    min: 8.0
    say: "まず、アランヤプラテート。バンコクから、アンコールワットへ向かう道の、国境の町です。巨大な国境市場も、あります。カンボジアとの国境まで、約{border_km_0}キロです。"
  - kind: wikipedia
    tag: クメールの寺院
    place: スドック・コック・トム
    name: スドック・コック・トム
    headline: スドック・コック・トム
    lines: ["11世紀のクメール寺院", "1053年の石碑が、約250年の王家の歴史を伝える", "国境のすぐそば（地図上の概算）"]
    wikipedia:
      - {lang: en, title: Sdok Kok Thom, contains: ["11th-century", stele, "two and a half centuries", Aranyaprathet]}
      - {lang: en, title: Aranyaprathet, contains: [Cambodia]}
