    say: "次に、スドック・コック・トム。十一世紀に、築かれた、クメールの寺院です。ここで見つかった、千五十三年の石碑には、約二百五十年にわたる、王家の歴史が、刻まれています。国境の、すぐそばです。"
  - kind: wikipedia
    tag: クメールの寺院
    place: パノム・ルン
    name: パノム・ルン
    headline: パノム・ルン
    lines: ["絶滅した火山の縁に建つ、クメールの寺院", "10世紀から13世紀に栄えた。修復に17年", "カンボジア国境まで 約{border_km_2}km（地図上の概算）"]
    wikipedia:
      - {lang: en, title: Phanom Rung Historical Park, contains: ["extinct volcano", "10th to the 13th centuries", "17 years"]}
      - {lang: en, title: Prasat Muang Tam, contains: ["Phanom Rung"]}
    source_line: 出典：en Wikipedia で確認（ja 版に項目なし）
