# ---------- 色の区分 ----------
tiers:
  thresholds: [1.30, 1.45, 1.55, 1.70]   # 境界値（未満/以上）。auto にすると5分位で自動設定
  # colors: [[76,124,196],[63,167,160],[232,201,90],[242,155,75],[229,72,77]]  # 省略時は既定の青→赤

# ---------- 画面の固定文言 ----------
title: 離婚率ランキング                   # 長いと自動で縮む
title_small: "{year}年｜都道府県別"
subtitle: "人口千人あたりの離婚数 ／ 全国平均 {avg}"
legend_title: "{metric}の色分け"
card_sub: 人口千人あたり
card_sub_first: "全国平均の約{ratio_avg}倍"
card_sub_last: "最下位（{last_vs_first}）"

# ---------- 声 ----------
voice:
  style_id: 2          # VOICEVOX スタイルID。2=四国めたん / 3=ずんだもん / 8=春日部つむぎ
  speed: 1.28
  credit: VOICEVOX:四国めたん   # 動画フッターと概要欄に入る。話者を変えたら必ず変える

# ---------- 構成（say=読み上げ、panel=画面の文字 [文字, サイズ, 色, 太さ]） ----------
hooks:
  - say: "都道府県別、{metric}ランキング。あなたの県は、何位？"
    min: 2.6
    gap: 0.5
    y: 380
    fade: 0.4
    panel:
      - [あなたの県は, 68, white, Bold]
      - [何位？, 200, yellow, Black]
  - say: "一番高い県と低い県で、差は{gap_text}。"
    min: 2.2
    gap: 0.45
    y: 400
    fade: 0.35
    panel:
      - ["{metric}が一番高い県と", 54, white, Bold]
      - [一番低い県の差は, 54, white, Bold]
      - ["{gap_text}", 190, red, Black]
  - say: 47位から、いきます。
    min: 1.6
    gap: 0.45
    y: 380
    fade: 0.35
    panel:
      - [47位から1位まで, 62, white, Black]
      - [一気に発表します, 62, yellow, Black]

intro_top10:
  say: ここからトップ10です。
  panel:
    - [ここから, 72, white, Bold]
    - [TOP10, 200, yellow, Black]

item_say:
  last: "{rank}位、{name}、{value}。ここが最下位です。"
  first: "そして1位は、{name}。{value}。全国平均の約{ratio_avg}倍です。"
  top10: "{rank}位、{name}、{value}。"

focus:                                    # 最後にスポットを当てる県（省略可）
  name: 東京都
  say: "ちなみに{focus}は、{focus_rank}位。{focus_say}。"
  panel:
    - ["{focus}は", 52, white, Bold]
    - ["{focus_rank}位", 140, white, Black]
    - ["{metric} {focus_value}{focus_tie}", 38, muted, Bold]
    - ["{focus_cmp}", 44, yellow, Black]

cta:
  say: "離婚の背景は、人それぞれ。決めつけないでね。あなたの県は、何位だった？コメントで教えてね。"
  panel:
    - [離婚の背景は人それぞれ。, 38, muted, Bold]
    - [数字だけで決めつけないでね, 38, muted, Bold]
    - [あなたの県は, 64, white, Bold]
    - [何位だった？, 124, yellow, Black]
    - [コメントで教えてね ↓, 54, white, Black]
    - [他の指標のランキングも → フォロー, 36, muted, Bold]

# ---------- 投稿用テキスト（post.md として自動生成） ----------
post:
  title: "【{year}年】都道府県別 {metric}ランキング｜あなたの県は何位？"
  description: >-
    {year}年の都道府県別{metric}（{unit}）ランキングです。1位は{first_name}、最下位は{last_name}。
    {metric}の背景は人それぞれ。数字だけで決めつけないでね。
  pinned_comment: あなたの県は何位でしたか？コメントで教えてください！
  hashtags: ["#{metric}", "#都道府県ランキング", "#統計", "#地域差", "#雑学"]
