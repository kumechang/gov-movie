# テーマ定義: 都道府県別ランキング動画 1本分の入力ファイル
# 動画・音声・投稿文はすべてこのファイルから作られる（src/ にテーマ固有の文言は置かない）。
# 文言中の {名前} は theme.py が計算して差し込む。使える変数は docs/THEME_SPEC.md を参照。

id: divorce_rate_2024            # 出力先 build/<id>/ になる
template: prefecture_map         # 現状は prefecture_map（日本地図ランキング）のみ

# ---------- データ ----------
metric: 離婚率                    # 画面の見出し・凡例に出る指標名
year: 2024
unit: 人口千対                    # 概要欄用の正式な単位
decimals: 2                       # 表示・読み上げの小数桁
average: 1.55                     # 全国値
rank_order: desc                  # desc: 値が大きいほど上位（1位が最大）

source:
  name: 厚生労働省「人口動態統計」2024年（確定数）
  note: （政府統計の総合窓口 e-Stat 掲載の表より）
  table: 人口動態調査 上巻 都道府県別にみた年次別離婚件数・離婚率（人口千対）（e-Stat 統計表ID 0003411861）
  url: https://www.e-stat.go.jp/stat-search/database?statdisp_id=0003411861
  fetch: estat                    # manual | estat。estat なら下の estat: に従って取得・照合する
verification: >-
  e-Stat から取得した値と、手で読み取った検証済みの値（下の values）が47県・全国値とも一致。
  さらに別の表（人口動態総覧）の離婚率と一致し、離婚件数÷人口からの再計算とも整合する。
  別動画の表示値20件以上とも一致。
  「東京=0.96（2025年概数）」と書く記事は2024年表と整合しないため不採用。

# e-Stat の取得定義（src/fetch_estat.py）。values / average は「検証済みの期待値」として取得値と突き合わせる。
estat:
  statsDataId: "0003411861"
  select: {cdTab: "10320", cdTime: "2024000000"}    # 表章項目=離婚率、時間軸=2024年
  cross:
    - label: 人口動態総覧の離婚率
      statsDataId: "0003411562"
      select: {cdCat01: "00430", cdTime: "2024000000"}
    - label: 離婚件数÷人口×1000
      numerator: {statsDataId: "0003411562", select: {cdCat01: "00280", cdTime: "2024000000"}}
      denominator: {statsDataId: "0003411562", select: {cdCat01: "00100", cdTime: "2024000000"}}
      scale: 1000

