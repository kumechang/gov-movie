    source_line: 出典：ja / en Wikipedia で確認
    photo_note: 写真は、シャルム・エル・シェイクのサンゴ礁
    photo: {file: "File:Коралловые рифы бухты Корал Бей.jpg"}
    min: 7.0
    say: "そして、シャルム・エル・シェイク。「平和の都市」という愛称を持つ、紅海のリゾートです。世界有数の、ダイビングの名所として、知られています。"

# ---------- ターンと結び ----------
turn:
  say: "でも、この地域は、外務省が出している、危険地帯と、隣り合わせなんです。"
  lines:
    - ["でも…", 130, red]
    - ["危険地帯と隣り合わせ", 64, white]

caution:
  head: 外務省は、こう伝えています
  say: "外務省は、北シナイ県では、テロリストの掃討作戦が、続いていると伝えています。また、2018年には、ギザのピラミッドの周辺で、外国人観光客が死傷する、爆発事件がありました。砂漠への移動は、旅行会社と、ガイドを、強く勧めています。"

closing:
  say: "人気のリゾートと、世界遺産が、危険な地域と、隣り合わせです。行く前に、外務省の最新の情報を、必ず確認してください。"
  lines:
    - ["隣り合わせの観光地帯", 58, white]
    - ["出発前に必ず確認", 54, yellow]

extra_credits:
  - "人気の根拠：ja / en Wikipedia で確認"

