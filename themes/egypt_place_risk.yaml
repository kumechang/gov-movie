# 場所と危険情報の型（place_vs_risk）: 「危険と隣り合わせの観光地帯 エジプト編」。
# シナイ半島のシャルム・エル・シェイク・ダハブ（アカバ湾沿岸＝レベル1の細い帯）と、聖カタリナ修道院（世界遺産。南シナイ県の内陸＝レベル2）の魅力を根拠つきで見せたあと、
# 北シナイ県（レベル3）・南シナイ県（レベル2）・沿岸の帯（レベル1）を、Natural Earth の州の境界と円・帯から地図に塗って見比べる。
# 人気の根拠は ja / en の Wikipedia で照合し、写真は Commons のライセンスを確認する（src/facts.py）。
# 危険レベル・地域・理由の文言は、公式の危険情報ページの本文に出てくることを毎回自動で確かめる（src/mofa.py）。書き方は docs/THEME_SPEC.md「場所と危険情報」。

id: egypt_place_risk
template: place_vs_risk

metric: 外務省の危険レベル
year: 2026
unit: レベル（1〜4）

source:
  name: 外務省 海外安全情報オープンデータ
  note: "（危険レベルは{asof}時点）"
  table: 海外安全情報オープンデータ 国別（country/0020.xml）と、エジプトの危険情報ページ
  url: https://www.ezairyu.mofa.go.jp/html/opendata/index.html
  license:
    checked: 2026-10-13
    terms_url: https://www.ezairyu.mofa.go.jp/html/opendata/support/terms.html
    commercial: true
    credit_lines:
      - 外務省 海外安全情報オープンデータ 提供情報（https://www.ezairyu.mofa.go.jp/html/opendata/index.html）を加工して作成
      - 出典：外務省 海外安全情報オープンデータ（https://www.ezairyu.mofa.go.jp/html/opendata/index.html）（{asof}に利用）
      - 地域・危険の理由の文言：外務省 海外安全ホームページ エジプトの危険情報（https://www.anzen.mofa.go.jp/）を要約
  fetch: mofa_risk

verification: >-
  危険レベルは外務省の国別XML（country/0020.xml）の値を、公式の危険情報ページ本文と照合して使う。
  画面の地域（レベル3: 北シナイ県／レベル2: 南シナイ県のアカバ湾沿岸以外／レベル1: ダハブからシャルム・エル・シェイクまでのアカバ湾沿岸地域）は、公式ページの「危険レベル」の節に
  その文言が出てきて、直後のレベル表示が一致することを毎回自動で確かめる。地域の注記と注意点の文言は、公式ページの本文にそのまま出てくることを確かめる。
  地図の塗り分けは、Natural Earth 10m の州・県の境界（目安）から。沿岸の細い帯（レベル1）は、公式の文言に幅の定めが無いため、位置を示す概算の帯（ダハブとシャルム・エル・シェイクを結ぶ線から約10km）。
  観光地の魅力（シャルム・エル・シェイクとダハブがダイビングの名所であること、聖カタリナ修道院が2002年に世界遺産になったこと）は、ja / en の Wikipedia の本文で確かめる
  （同じ Wikipedia の別言語版なので、独立した2系統とは言えない）。
  写真は Wikimedia Commons でライセンス（CC0 / パブリックドメイン / CC BY）と作者を確認し、画面と概要欄に出典を載せる。
  地図上の位置・範囲は、おおよその目安として画面に明記する。結果は build/egypt_place_risk/fetch_report.txt。

mofa:
  max_age_hours: 24

# ---------- 見た目 ----------
