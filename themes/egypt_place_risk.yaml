# ---------- 投稿用テキスト（post.md として自動生成） ----------
post:
  title: "【{asof}時点】危険と隣り合わせの観光地帯 エジプト編。シナイ半島のリゾートと世界遺産、外務省の危険情報"
  description: >-
    エジプトのシナイ半島には、ダイビングの名所のシャルム・エル・シェイクとダハブ、2002年に世界遺産になった聖カタリナ修道院があります。
    外務省の危険情報では、北シナイ県はレベル3（渡航中止勧告）、南シナイ県の内陸はレベル2（2026年9月にレベル3から引き下げ）で、
