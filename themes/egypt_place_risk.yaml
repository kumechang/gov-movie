# ---------- 画面の固定文言 ----------
title: 危険と隣り合わせの観光地帯
title_small: エジプト編｜外務省の危険情報と見比べる
subtitle: "魅力と、危険情報の地域（{asof}時点）"
footnote: "危険情報の最終更新：{risk_date}｜地図の位置・範囲はおおよそです"

# 地図は、シナイ半島を拡大して見せる（bbox = [経度の最小, 緯度の最小, 経度の最大, 緯度の最大]）
map:
  bbox: [32.2, 27.4, 35.3, 31.6]

# ---------- 対象の国と、地図に出す地域 ----------
# provinces: Natural Earth の州・県の英語名（その州全体を塗る）。holes は、地域から抜く例外（[経度, 緯度, 半径km]）。bands（2点以上）＋ width_km は、位置を示す帯。
members:
  - code: "0020"
    label: エジプト
    iso: EGY
    regions:
      - level: 3
        where: 北シナイ県
        display: 北シナイ県
        provinces: ["Shamal Sina'"]
        note: エジプト政府によるテロリスト掃討作戦が展開されています
        label_at: [33.7, 30.75]
        say: "シナイ半島の北、北シナイ県は、レベル3。渡航は止めてください。"
      - level: 2
        where: 南シナイ県ダハブからシャルム・エル・シェイクまでのアカバ湾沿岸地域を除く同県全域
        display: 南シナイ県（沿岸をのぞく）
        provinces: ["Janub Sina'"]
        holes:
          - [34.51, 28.50, 13]
          - [34.48, 28.35, 13]
          - [34.44, 28.18, 13]
          - [34.40, 28.02, 13]
          - [34.33, 27.91, 16]
        note: エジプト政府の治安対策強化により治安情勢が安定していることから、危険情報をレベル3から2へ引き下げます
        label_at: [33.25, 29.4]
        say: "その南、南シナイ県の内陸は、レベル2です。2026年9月に、レベル3から、2に、引き下げられました。せいカタリナ修道院は、この中にあります。"
      - level: 1
        where: ダハブからシャルム・エル・シェイクまでのアカバ湾沿岸地域
        display: ダハブ〜シャルムの沿岸
        bands:
          - [[34.51, 28.50], [34.48, 28.35], [34.44, 28.18], [34.40, 28.02], [34.33, 27.91]]
        width_km: 20
        clip: true
        place_note: レベル2の地域にはさまれた、細い沿岸の帯です
        label_at: [35.05, 28.05]
        say: "アカバ湾の沿岸、ダハブから、シャルム・エル・シェイクまでが、レベル1。レベル2の地域に、はさまれた、細い帯です。"
    why:
      - tag: テロ
        text: 北シナイ県では、政府のテロリスト掃討作戦が続いている
        evidence: エジプト政府によるテロリスト掃討作戦が展開されています
      - tag: 事件
        text: 2018年12月、ギザのピラミッド周辺で、外国人観光客が死傷する爆発事件
        evidence: 2018年12月にはギザ市のピラミッドエリア周辺で外国人観光客が死傷する爆発事件
      - tag: 注意
        text: 砂漠への移動は、信頼できる旅行会社と、ガイドの帯同を強く推奨
        evidence: 現地ガイドの帯同を得ることを強く推奨します

# 人気の場所（地図に印を出す。座標は Wikipedia・Wikidata の位置。概算）。
places:
  - {name: シャルム・エル・シェイク, label: シャルム, marker: [34.33, 27.91], in_region: ダハブからシャルム・エル・シェイクまでのアカバ湾沿岸地域, side: below-right}
  - {name: ダハブ, marker: [34.51, 28.50], in_region: ダハブからシャルム・エル・シェイクまでのアカバ湾沿岸地域, side: above-right}
  - {name: 聖カタリナ修道院, label: 聖カタリナ, marker: [33.976, 28.556], in_region: 南シナイ県ダハブからシャルム・エル・シェイクまでのアカバ湾沿岸地域を除く同県全域, side: left}

# ---------- 魅力の紹介（根拠は ja / en の Wikipedia で照合。photo.file は Commons のファイル名） ----------
scenes:
  - kind: wikipedia
    tag: 世界遺産
    place: 聖カタリナ修道院
    name: 聖カタリナ修道院
    headline: 聖カタリナ修道院
    lines: ["モーセが十戒を授かった、シナイ山のふもと", "世界最古の修道院とされる。2002年に世界遺産"]
