      - {lang: ja, title: 聖カタリナ修道院, contains: [世界最古, モーセ, シナイ山, "2002"]}
      - {lang: en, title: "Saint Catherine's Monastery", contains: [oldest, "2002", UNESCO]}
    source_line: 出典：ja / en Wikipedia で確認
    photo: {file: "File:Saint Catherine Sinai.jpg"}
    min: 8.0
    say: "まず、せいカタリナ修道院。モーセが、十戒を授かった、とされる、シナイ山の、ふもとにあります。六世紀に建てられ、今も続く、世界最古の修道院とされ、2002年に、世界遺産になりました。"
  - kind: wikipedia
    tag: ダイビングの名所
    place: ダハブ
    name: ダハブ
    headline: ダハブ
    lines: ["ベドウィンの暮らす、小さな漁村が", "ダイビングの名所になった町"]
    wikipedia:
      - {lang: ja, title: ダハブ, contains: [ベドウィン, 漁村, ダイビング]}
      - {lang: en, title: Dahab, contains: [Bedouin, diving]}
    source_line: 出典：ja / en Wikipedia で確認
    photo: {file: "File:Shoreline in Dahab.jpg"}
    min: 7.0
    say: "次に、ダハブ。かつては、ベドウィンの暮らす、小さな漁村でした。いまは、世界でも名高い、ダイビングの名所として、多くの観光客が訪れます。"
  - kind: wikipedia
    tag: 紅海のリゾート
    place: シャルム・エル・シェイク
    name: シャルム・エル・シェイク
    headline: シャルム・エル・シェイク
    lines: ["「平和の都市」の愛称を持つ、紅海のリゾート", "世界有数のダイビングの名所"]
    wikipedia:
