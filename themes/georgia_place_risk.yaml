# ---------- 投稿用テキスト（post.md として自動生成） ----------
post:
  title: "【{asof}時点】危険と隣り合わせの観光地帯 ジョージア編。ナポレオンのデスマスクがある宮殿も、外務省のレベル3の近く"
  description: >-
    ジョージアの世界遺産スヴァネティ、ナポレオンのデスマスクを展示するダディアニ宮殿のあるズグディディ、スターリンが生まれた町ゴリ。
    外務省の危険情報では、ツヒンヴァリ/南オセチア及びその周辺地域、アブハジア及びその周辺地域はレベル3（渡航中止勧告）、ロシアとの国境周辺地域はレベル2、上記を除く全土はレベル1です。
    「周辺地域」や「国境周辺地域」の範囲は、公式のページには書かれていません。境界線の付近では、周辺住民が拘束される事件が頻発していると外務省は伝えています。
    危険情報は国全体ではなく地域ごとに違います。地域と理由は、外務省の危険情報ページの記載を要約しました。渡航前には、必ず外務省の最新の情報を確認してください。
  pinned_comment: 次に見たい国は、どこですか？コメントで教えてください！
  hashtags: ["#危険と隣り合わせの観光地帯", "#ジョージア", "#スヴァネティ", "#コーカサス", "#外務省", "#危険情報", "#海外旅行"]
