# ---------- 投稿用テキスト（post.md として自動生成） ----------
post:
  title: "【{asof}時点】危険と隣り合わせの観光地帯 アルジェリア編。ティムガドは、外務省のレベル3の近く"
  description: >-
    アルジェリアの世界遺産、アルジェのカスバ、ローマ都市ティムガド、山のローマ遺跡ジェミラ。
    外務省の危険情報では、リビア・ニジェール・マリ・モーリタニアとの国境地帯とイリジ県イナメナス地区がレベル4（退避勧告）。ティジ・ウズ県の山間部・ベジャイア県西部・ヘンシュラ県・テベッサ県・南部の各県などがレベル3（渡航中止勧告）。ブーメルデス県・ブイラ県・バトナ県・メデア県・ティジ・ウズ市などがレベル2。上記以外の地域はレベル1です。
    アルジェからレベル3の地域までは約{zone3_km_0}km、ティムガドからは約{zone3_km_1}km、ジェミラからは約{zone3_km_2}km（地図上の概算）。
