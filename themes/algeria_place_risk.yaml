# 場所と危険情報の型（place_vs_risk）: 「危険と隣り合わせの観光地帯 アルジェリア編」。
# 外務省の危険情報（アルジェリア）: レベル4＝リビア・ニジェール・マリ・モーリタニアとの国境地帯とイリジ県イナメナス地区／レベル3＝ティジ・ウズ県の山間部・ベジャイア県西部・ヘンシュラ県・テベッサ県・南部の各県など／レベル2＝ブーメルデス県・ブイラ県・バトナ県・メデア県・ティジ・ウズ市など／レベル1＝上記以外。
# 観光地として、アルジェのカスバ（レベル1）・ティムガド（バトナ県。レベル2の中で、レベル3のヘンシュラ県の近く）・ジェミラ（レベル1）を見せる。
# 県の境界は Natural Earth。ティジ・ウズ県の「山間部」は、県全体で塗り、県都ティジ・ウズ市の周り（半径15km）を穴にした目安。ベジャイア県西部は円。南部の各県・国境地帯は、この回の図の範囲の外、または細かいため図に出さない（チュニジア国境のエル・ウェッド県・ウアルグラ県も出さない）。
# 人気の根拠は ja / en の Wikipedia で照合し、写真は Commons のライセンスを確認する（src/facts.py）。
# 危険レベル・地域・理由の文言は、公式の危険情報ページの本文に出てくることを毎回自動で確かめる（src/mofa.py）。書き方は docs/THEME_SPEC.md「場所と危険情報」。

id: algeria_place_risk
template: place_vs_risk

metric: 外務省の危険レベル
year: 2026
unit: レベル（1〜4）

source:
  name: 外務省 海外安全情報オープンデータ
  note: "（危険レベルは{asof}時点）"
  table: 海外安全情報オープンデータ 国別（country/0213.xml）と、アルジェリアの危険情報ページ
  url: https://www.ezairyu.mofa.go.jp/html/opendata/index.html
  license:
    checked: 2026-10-13
    terms_url: https://www.ezairyu.mofa.go.jp/html/opendata/support/terms.html
    commercial: true
    credit_lines:
      - 外務省 海外安全情報オープンデータ 提供情報（https://www.ezairyu.mofa.go.jp/html/opendata/index.html）を加工して作成
      - 出典：外務省 海外安全情報オープンデータ（https://www.ezairyu.mofa.go.jp/html/opendata/index.html）（{asof}に利用）
      - 地域・危険の理由の文言：外務省 海外安全ホームページ アルジェリアの危険情報（https://www.anzen.mofa.go.jp/）を要約
  fetch: mofa_risk

verification: >-
  危険レベルは外務省の国別XML（country/0213.xml）の値を、公式の危険情報ページ本文と照合して使う。
  画面の地域（レベル3: ティジ・ウズ県の山間部・ベジャイア県西部・ヘンシュラ県・テベッサ県ほか／レベル2: ブーメルデス県・ブイラ県・バトナ県・メデア県・ティジ・ウズ市ほか／レベル1: 上記以外）は、公式ページの「危険レベル」の節にその文言が出てきて、直後のレベル表示が一致することを毎回自動で確かめる。
  地図の範囲は概算: 県は Natural Earth の県境。ティジ・ウズ県の山間部は県全体で塗り、県都の周り（半径15km）を穴にした目安。ベジャイア県西部は円。南部の各県・国境地帯・チュニジア国境の県は図に出さない。
  観光地からレベル3の地域までの距離は、座標とこの図形からの概算（5km単位）。
  地域の注記と注意点の文言は、公式ページの本文にそのまま出てくることを確かめる。
  観光地の根拠は、ja / en の Wikipedia の本文で確かめる（同じ Wikipedia の別言語版なので、独立した2系統とは言えない）。
  写真は Wikimedia Commons でライセンス（CC0 / パブリックドメイン / CC BY / CC BY-SA）と作者を確認し、画面と概要欄に出典を載せる。結果は build/algeria_place_risk/fetch_report.txt。

mofa:
  max_age_hours: 24


