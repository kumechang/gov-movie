# ---------- 投稿用テキスト（post.md として自動生成） ----------
post:
  title: "【{asof}時点】危険と隣り合わせの観光地帯 アルメニア編。ホル・ヴィラップもタテヴも、外務省のレベル4の近く"
  description: >-
    アルメニアの人気の観光地、古い首都エレバン、巡礼の地ホル・ヴィラップ、谷の修道院タテヴ。
    外務省の危険情報では、アゼルバイジャンとの国境周辺地域（ナヒチェバンとの国境地域を含む）がレベル4（退避勧告）。シュニク州全域と、レベル4地域と接する地域はレベル2。それ以外（エレバンを含む）はレベル1です。
    エレバンから国境周辺のレベル4の地域までは約{zone4_km_0}km、ホル・ヴィラップからは約{zone4_km_1}km、タテヴからは約{zone4_km_2}km（地図上の概算）。
