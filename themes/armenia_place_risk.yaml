# 場所と危険情報の型（place_vs_risk）: 「危険と隣り合わせの観光地帯 アルメニア編」。
# 外務省の危険情報（アルメニア）: レベル4＝アゼルバイジャンとの国境周辺地域（ナヒチェバン自治共和国との国境地域を含む）／レベル2＝シュニク州全域と、アララト州・ゲガルクニク州・ヴァヨツ・ゾル州・タヴシュ州のレベル4地域と接する地域／レベル1＝それ以外（エレバンを含む）。
# 国境の近くにある観光地として、エレバン（レベル1の首都）・ホル・ヴィラップ修道院（ナヒチェバンとの国境の近く）・タテヴ修道院（シュニク州。レベル2の中）を見せる。
# 州の境界は Natural Earth（シュニク州）。アゼルバイジャンとの国境周辺（レベル4）は国境から約20km、「レベル4地域と接する地域」（レベル2）は国境から約45kmまでの帯（どちらも公式に範囲の定めがない。目安）。
# 地図の線は国の境界を主張するものではなく、外務省の危険情報の地域を示す目安。
# 人気の根拠は ja / en の Wikipedia で照合し、写真は Commons のライセンスを確認する（src/facts.py）。ホル・ヴィラップとタテヴは ja 版が短いので、en のみ（画面に明記）。
# 危険レベル・地域・理由の文言は、公式の危険情報ページの本文に出てくることを毎回自動で確かめる（src/mofa.py）。書き方は docs/THEME_SPEC.md「場所と危険情報」。

id: armenia_place_risk
template: place_vs_risk

metric: 外務省の危険レベル
year: 2026
unit: レベル（1〜4）

source:
  name: 外務省 海外安全情報オープンデータ
  note: "（危険レベルは{asof}時点）"
  table: 海外安全情報オープンデータ 国別（country/0374.xml）と、アルメニアの危険情報ページ
  url: https://www.ezairyu.mofa.go.jp/html/opendata/index.html
  license:
    checked: 2026-10-13
    terms_url: https://www.ezairyu.mofa.go.jp/html/opendata/support/terms.html
    commercial: true
    credit_lines:
      - 外務省 海外安全情報オープンデータ 提供情報（https://www.ezairyu.mofa.go.jp/html/opendata/index.html）を加工して作成
      - 出典：外務省 海外安全情報オープンデータ（https://www.ezairyu.mofa.go.jp/html/opendata/index.html）（{asof}に利用）
      - 地域・危険の理由の文言：外務省 海外安全ホームページ アルメニアの危険情報（https://www.anzen.mofa.go.jp/）を要約
  fetch: mofa_risk

verification: >-
  危険レベルは外務省の国別XML（country/0374.xml）の値を、公式の危険情報ページ本文と照合して使う。
  画面の地域（レベル4: アゼルバイジャンとの国境周辺地域／レベル2: シュニク州全域と、レベル4地域と接する地域／レベル1: それ以外）は、公式ページの「危険レベル」の節にその文言が出てきて、直後のレベル表示が一致することを毎回自動で確かめる。
  地域の注記と注意点の文言は、公式ページの本文にそのまま出てくることを確かめる。
  地図の範囲は概算: シュニク州は Natural Earth の州境（目安）。アゼルバイジャンとの国境周辺（レベル4）は国境から約20km、レベル4地域と接する地域（レベル2）は国境から約45kmまでの帯（どちらも公式に範囲の定めがない）。地図の線は国境の主張ではない。
  観光地からレベル4の地域までの距離は、座標とこの図形からの概算（5km単位）。
  観光地の根拠は、ja / en の Wikipedia の本文で確かめる（同じ Wikipedia の別言語版なので、独立した2系統とは言えない）。ホル・ヴィラップ・タテヴは en のみ。
  写真は Wikimedia Commons でライセンス（CC0 / パブリックドメイン / CC BY / CC BY-SA）と作者を確認し、画面と概要欄に出典を載せる。結果は build/armenia_place_risk/fetch_report.txt。

mofa:
  max_age_hours: 24


# ---------- 見た目 ----------
# style は本編（ターン以降）の恐怖演出。calm_style で、ターンの前（人気の場面）だけ落ち着いた色に差し替える。
style:
  look: horror
  fonts:
    Black: assets/fonts/KaiseiTokumin-ExtraBold.ttf
    Bold: assets/fonts/KaiseiTokumin-ExtraBold.ttf
    Accent: assets/fonts/YujiBoku-Regular.ttf
  bg: {top: [3, 0, 1], bottom: [28, 2, 5], fog: [120, 0, 12], fog_height: 0.38, vignette: 0.78, grain: 0.03}
  text: [238, 228, 222]
  muted: [168, 128, 128]
  accent: [226, 34, 44]
  title_color: [206, 18, 30]
  title_glow: [150, 0, 8]
  drips: [150, 0, 10]
  pill: {fill: [90, 0, 8, 130], outline: [200, 30, 40, 170], text: [240, 205, 205]}
  panel: {fill: [10, 0, 2, 234], outline: [190, 20, 30, 150], stroke: [0, 0, 0, 255]}
  bar: {bg: [52, 10, 14], fill: [204, 24, 36]}
  fx: {shake: 16, flash: [170, 0, 10], flash_alpha: 0.38, embers: true}
  named_colors:
    white: [238, 228, 222]
    yellow: [232, 188, 70]
    red: [226, 26, 38]
    muted: [168, 128, 128]

calm_style:
  bg: {top: [12, 22, 44], bottom: [34, 52, 88], vignette: 0.55, grain: 0.02}
  title_color: [244, 236, 224]
  title_glow: null
  drips: null
  pill: {fill: [255, 255, 255, 30], outline: [255, 255, 255, 80], text: [236, 232, 224]}


# ---------- 画面の固定文言 ----------
title: 危険と隣り合わせの観光地帯
title_small: アルメニア編｜外務省の危険情報と見比べる
subtitle: "魅力と、危険情報の地域（{asof}時点）"
footnote: "危険情報の最終更新：{risk_date}｜地図の位置・範囲はおおよそです"

# 地図: アルメニア全体（アゼルバイジャンとの国境周辺とシュニク州）を見せる（bbox = [経度の最小, 緯度の最小, 経度の最大, 緯度の最大]）
map:
  bbox: [43.3, 38.7, 47.2, 41.4]


# ---------- 対象の国と、地図に出す地域 ----------
# provinces: Natural Earth の州の名前。border: 国境から km 以内の帯。
members:
  - code: "0374"
    label: アルメニア
    iso: ARM
    regions:
      - level: 4
        where: アゼルバイジャンとの国境周辺地域（ナヒチェバン自治共和国との国境地域を含む。）
        display: アゼルバイジャンとの国境周辺
        border: {with: AZE, km: 20}
        note: 依然として発砲事案が断続的に発生しています
        label_at: [43.7, 39.4]
        say: "アゼルバイジャンとの、国境の周辺は、レベル4。退避してください。"
      - level: 2
        where: シュニク州全域及びアララト州、ゲガルクニク州、ヴァヨツ・ゾル州、タヴシュ州のレベル4地域と接する地域
        display: シュニク州全域と、レベル4地域と接する地域
        provinces: [Syunik]
        border: {with: AZE, km: 45}
        label_at: [46.9, 40.0]
        say: "シュニク州の全域と、国境周辺に、接する地域は、レベル2です。"
      - level: 1
        where: アララト州、ゲガルクニク州、ヴァヨツ・ゾル州、タヴシュ州のレベル4、レベル2以外の地域
        display: 国境の州の、それ以外の地域
        say: "国境に接する州でも、国境の周辺以外は、レベル1に、引き下げられました。"
      - level: 1
        where: 上記以外の地域（首都エレバンを含む。）
        display: 上記以外（エレバンなど）
        place_note: エレバンは、この中です
        say: "首都エレバンを含む、上記以外の地域も、レベル1です。"
    why:
      - tag: 発砲
        text: 国境周辺では、発砲事案が断続的に発生
        evidence: 依然として発砲事案が断続的に発生しています
      - tag: 波及
        text: 国境周辺の事案が、近くの地域に波及するおそれ
        evidence: 国境周辺で発生した事案が波及し不測の事態が発生する可能性が排除されない
      - tag: デモ
        text: エレバンなどでは、デモ・集会も見られる
        evidence: 反体制派等によるデモ集会等も散見されている

# 人気の場所（地図に印を出す。座標は Wikipedia の位置。概算）。
places:
  - {name: エレバン, marker: [44.5126, 40.1776], region: 上記以外の地域（首都エレバンを含む。）, side: above}
  - {name: ホル・ヴィラップ, marker: [44.5775, 39.8789], in_region: シュニク州全域及びアララト州、ゲガルクニク州、ヴァヨツ・ゾル州、タヴシュ州のレベル4地域と接する地域, side: left}
  - {name: タテヴ, marker: [46.2500, 39.3794], in_region: シュニク州全域及びアララト州、ゲガルクニク州、ヴァヨツ・ゾル州、タヴシュ州のレベル4地域と接する地域, side: below}

# ---------- 魅力の紹介（根拠は ja / en の Wikipedia で照合。photo.file は Commons のファイル名） ----------
scenes:
  - kind: wikipedia
    tag: 古い首都
    place: エレバン
    name: エレバン
    headline: エレバン
    lines: ["紀元前782年に築かれた要塞が起源", "世界で最も古くから人が住み続ける都市のひとつ", "国境周辺（レベル4）まで 約{zone4_km_0}km"]
    wikipedia:
      - {lang: ja, title: エレバン, contains: [紀元前8世紀, エレブニ]}
      - {lang: en, title: Yerevan, contains: ["oldest continuously inhabited", "782 BC"]}
    source_line: 出典：ja / en Wikipedia で確認
    photo: {file: "PHOTO_YEREVAN"}
    min: 8.0
    say: "まず、エレバン。紀元前七百八十二年に、築かれた要塞が、起源の首都です。世界で、最も古くから、人が住み続ける、都市の、ひとつです。国境周辺の、レベル4まで、約{zone4_km_0}キロです。"
  - kind: wikipedia
    tag: 巡礼の地
    place: ホル・ヴィラップ
    name: ホル・ヴィラップ
    headline: ホル・ヴィラップ
    lines: ["聖グレゴリオスが、13年間閉じ込められた穴", "トルコとの国境のすぐそば。アララト山を望む", "国境周辺（レベル4）まで 約{zone4_km_1}km"]
    wikipedia:
      - {lang: en, title: Khor Virap, contains: ["imprisoned there for 13 years", "border with Turkey"]}
      - {lang: en, title: Mount Ararat, contains: [Armenia]}
    source_line: 出典：en Wikipedia で確認（ja 版は記述が少ない。外務省の文言は公式ページ）
    photo: {file: "PHOTO_KHORVIRAP"}
    min: 8.0
    say: "次に、ホル・ヴィラップ。アルメニアの守護聖人が、十三年間、閉じ込められた、穴が、ある修道院です。トルコとの、国境の、すぐそばです。国境周辺の、レベル4まで、約{zone4_km_1}キロです。"
  - kind: wikipedia
    tag: 谷の修道院
    place: タテヴ
    name: タテヴ修道院
    headline: タテヴ修道院
    lines: ["深い谷の縁に建つ、9世紀の修道院", "世界一長い、往復式のロープウェイで行く", "国境周辺（レベル4）まで 約{zone4_km_2}km"]
    wikipedia:
      - {lang: en, title: Tatev Monastery, contains: ["9th-century", "longest non-stop double track cable car"]}
      - {lang: en, title: Syunik Province, contains: [Tatev]}
    source_line: 出典：en Wikipedia で確認（ja 版は記述が少ない。外務省の文言は公式ページ）
    photo: {file: "PHOTO_TATEV"}
    min: 8.0
    say: "そして、タテヴ修道院。深い谷の縁に建つ、九世紀の修道院です。世界一長い、往復式の、ロープウェイで、行けます。国境周辺の、レベル4まで、約{zone4_km_2}キロです。"

# ---------- ターンと結び ----------
turn:
  say: "でも、この人気の観光地は、外務省が出している、危険地帯と、隣り合わせなんです。"
  lines:
    - ["でも…", 130, red]
    - ["危険地帯と隣り合わせ", 64, white]

caution:
  head: 外務省は、こう伝えています
  say: "外務省は、アゼルバイジャンとの国境周辺では、発砲事案が、断続的に発生していると、伝えています。国境周辺で起きた事案が、近くの地域に、波及する可能性も、排除されないとしています。"

closing:
  say: "有名な修道院の、すぐ近くに、レベル4の地域が、あります。エレバンは、レベル1、ホル・ヴィラップと、タテヴは、レベル2の地域です。行く前に、外務省の最新の情報を、必ず確認してください。"
  lines:
    - ["隣り合わせの観光地帯", 58, white]
    - ["出発前に必ず確認", 54, yellow]

extra_credits:
  - "人気の根拠：ja / en Wikipedia で確認（ホル・ヴィラップ・タテヴは en のみ）"


# ---------- 声 ----------
voice:
  vvm: [1]
  style_id: 14
  speed: 1.12
  pitch: -0.03
  intonation: 0.9
  credit: VOICEVOX:冥鳴ひまり


