# 場所と危険情報の型（place_vs_risk）: 「危険と隣り合わせの観光地帯 メキシコ編」。
# 外務省の危険情報（メキシコ）: レベル3＝ゲレロ州チルパンシンゴ市及びその周辺地域／レベル2＝ゲレロ州のほか多数の州・地域／レベル1＝上記以外（メキシコ市・オアハカ州・キンタナ・ロー州など）。
# レベル3に近い人気の観光地として、アカプルコ（ゲレロ州。レベル2の中）・タスコ（ゲレロ州で唯一レベル1の市）・グアナファト（世界遺産。同じ州の南部がレベル2）を見せる。
# 州・県の境界は Natural Earth（目安）。「南部地域」「トマトラン市とチャパラ湖等を含む南部地域」「一部地域を除く」など、範囲が公式に書かれていない地域は、図を目安として塗る（画面と概要欄で明記）。
# 人気の根拠は ja / en の Wikipedia で照合し、写真は Commons のライセンスを確認する（src/facts.py）。
# 危険レベル・地域・理由の文言は、公式の危険情報ページの本文に出てくることを毎回自動で確かめる（src/mofa.py）。書き方は docs/THEME_SPEC.md「場所と危険情報」。

id: mexico_place_risk
template: place_vs_risk

metric: 外務省の危険レベル
year: 2026
unit: レベル（1〜4）

source:
  name: 外務省 海外安全情報オープンデータ
  note: "（危険レベルは{asof}時点）"
  table: 海外安全情報オープンデータ 国別（country/0052.xml）と、メキシコの危険情報ページ
  url: https://www.ezairyu.mofa.go.jp/html/opendata/index.html
  license:
    checked: 2026-10-13
    terms_url: https://www.ezairyu.mofa.go.jp/html/opendata/support/terms.html
    commercial: true
    credit_lines:
      - 外務省 海外安全情報オープンデータ 提供情報（https://www.ezairyu.mofa.go.jp/html/opendata/index.html）を加工して作成
      - 出典：外務省 海外安全情報オープンデータ（https://www.ezairyu.mofa.go.jp/html/opendata/index.html）（{asof}に利用）
      - 地域・危険の理由の文言：外務省 海外安全ホームページ メキシコの危険情報（https://www.anzen.mofa.go.jp/）を要約
  fetch: mofa_risk

verification: >-
  危険レベルは外務省の国別XML（country/0052.xml）の値を、公式の危険情報ページ本文と照合して使う。
  画面の地域（レベル3: ゲレロ州チルパンシンゴ市及びその周辺地域／レベル2: ゲレロ州ほか／レベル1: 上記以外）は、公式ページの「危険レベル」の節にその文言が出てきて、直後のレベル表示が一致することを毎回自動で確かめる。
  地域の注記と注意点の文言は、公式ページの本文にそのまま出てくることを確かめる。
  地図の範囲は概算: 州は Natural Earth の州境（目安）。チルパンシンゴ市とその周辺は、市の位置を中心にした円（公式に範囲の定めがない）。グアナファト州の南部・ハリスコ州の南部は、州を緯度で切った目安。
  ミチョアカン州の「一部地域を除く」は、どこが除かれるか公式に書かれていないので、州全体を塗り、画面にも「一部地域をのぞく」と書く。地図の外の州（サカテカス州・シナロア州・タマウリパス州など）は、一部しか見えない。
  観光地からレベル3の地域までの距離は、座標とこの円からの概算（5km単位）。
  観光地の根拠は、ja / en の Wikipedia の本文で確かめる（同じ Wikipedia の別言語版なので、独立した2系統とは言えない）。
  写真は Wikimedia Commons でライセンス（CC0 / パブリックドメイン / CC BY）と作者を確認し、画面と概要欄に出典を載せる。結果は build/mexico_place_risk/fetch_report.txt。

mofa:
  max_age_hours: 24

