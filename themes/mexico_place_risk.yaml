# ---------- 投稿用テキスト（post.md として自動生成） ----------
post:
  title: "【{asof}時点】危険と隣り合わせの観光地帯 メキシコ編。アカプルコもタスコも、外務省のレベル3の近く"
  description: >-
    メキシコの人気の観光地、ビーチリゾートのアカプルコ、銀の町タスコ、世界遺産の街グアナファト。
    外務省の危険情報では、ゲレロ州チルパンシンゴ市及びその周辺地域がレベル3（渡航中止勧告）。ゲレロ州のほかの地域（アカプルコを含む）、コリマ州、ミチョアカン州、グアナファト州の南部などはレベル2です。
