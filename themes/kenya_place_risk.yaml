# 場所と危険情報の型（place_vs_risk）: 「危険と隣り合わせの観光地帯 ケニア編」。
# 外務省の危険情報（ケニア）: レベル4＝ソマリアとの国境地帯・ダダーブ難民キャンプ周辺・ガリッサ／レベル3＝北東部地域・ラム郡・トゥルカナ郡南部・ウェスト・ポコット郡など／レベル2＝トゥルカナ郡の北〜中部・サンブル郡など／レベル1＝その他の地域。
# 世界遺産がレベル3・2の中にある例として、ラム旧市街（レベル3の中）・トゥルカナ湖（レベル2の中。レベル3のすぐ近く）、対比としてモンバサのジーザス要塞（レベル1）を見せる。
# 州（地方）の境界は Natural Earth（北東部地域）。郡の単位は郡の境界のデータが無いので、郡の中心の位置の円（目安）で示す。ソマリアとの国境地帯は国境から約20kmの帯（公式に範囲の定めがない。目安）。
# エチオピア・南スーダン・ウガンダとの国境地帯の一部、マルサビット郡、ナイロビなどは、この回の図には出さない（範囲の外、または細かい範囲のため）。
# 人気の根拠は ja / en の Wikipedia で照合し、写真は Commons のライセンスを確認する（src/facts.py）。
# 危険レベル・地域・理由の文言は、公式の危険情報ページの本文に出てくることを毎回自動で確かめる（src/mofa.py）。書き方は docs/THEME_SPEC.md「場所と危険情報」。

id: kenya_place_risk
template: place_vs_risk

metric: 外務省の危険レベル
year: 2026
unit: レベル（1〜4）

source:
  name: 外務省 海外安全情報オープンデータ
  note: "（危険レベルは{asof}時点）"
  table: 海外安全情報オープンデータ 国別（country/0254.xml）と、ケニアの危険情報ページ
  url: https://www.ezairyu.mofa.go.jp/html/opendata/index.html
  license:
    checked: 2026-10-13
    terms_url: https://www.ezairyu.mofa.go.jp/html/opendata/support/terms.html
    commercial: true
    credit_lines:
      - 外務省 海外安全情報オープンデータ 提供情報（https://www.ezairyu.mofa.go.jp/html/opendata/index.html）を加工して作成
      - 出典：外務省 海外安全情報オープンデータ（https://www.ezairyu.mofa.go.jp/html/opendata/index.html）（{asof}に利用）
      - 地域・危険の理由の文言：外務省 海外安全ホームページ ケニアの危険情報（https://www.anzen.mofa.go.jp/）を要約
  fetch: mofa_risk

verification: >-
  危険レベルは外務省の国別XML（country/0254.xml）の値を、公式の危険情報ページ本文と照合して使う。
  画面の地域（レベル4: ソマリアとの国境地帯・ダダーブ難民キャンプ周辺・ガリッサ／レベル3: 北東部地域・ラム郡・トゥルカナ郡南部・ウェスト・ポコット郡・バリンゴ郡北部／レベル2: トゥルカナ郡の北〜中部・サンブル郡／レベル1: その他）は、公式ページの「危険レベル」の節にその文言が出てきて、直後のレベル表示が一致することを毎回自動で確かめる。
  地域の注記と注意点の文言は、公式ページの本文にそのまま出てくることを確かめる。
  地図の範囲は概算: 北東部地域（ガリッサ・ワジル・マンデラの各郡）は Natural Earth の地方の境界（目安）。ラム郡・トゥルカナ郡・ウェスト・ポコット郡・バリンゴ郡・サンブル郡・ガリッサ・ダダーブは、中心の位置の円（目安）。ソマリアとの国境地帯は国境から約20kmの帯（公式に範囲の定めがない）。
  観光地からレベル3の地域までの距離は、座標とこの図形からの概算（5km単位）。
  観光地の根拠は、ja / en の Wikipedia の本文で確かめる（同じ Wikipedia の別言語版なので、独立した2系統とは言えない）。
  写真は Wikimedia Commons でライセンス（CC0 / パブリックドメイン / CC BY / CC BY-SA）と作者を確認し、画面と概要欄に出典を載せる。結果は build/kenya_place_risk/fetch_report.txt。

mofa:
  max_age_hours: 24


# ---------- 見た目 ----------
