# ---------- 画面の固定文言 ----------
title: 危険と隣り合わせの観光地帯
title_small: ケニア編｜外務省の危険情報と見比べる
subtitle: "魅力と、危険情報の地域（{asof}時点）"
footnote: "危険情報の最終更新：{risk_date}｜地図の位置・範囲はおおよそです"

# 地図: ケニア（北部のトゥルカナ湖から、沿岸のラム・モンバサまで）を見せる（bbox = [経度の最小, 緯度の最小, 経度の最大, 緯度の最大]）
map:
  bbox: [34.0, -4.8, 42.6, 4.8]


# ---------- 対象の国と、地図に出す地域 ----------
# provinces: Natural Earth の地方（North-Eastern = 北東部地域）。border: 国境から km 以内の帯。bands（1点）＋ radius_km: 円。
members:
  - code: "0254"
    label: ケニア
    iso: KEN
    regions:
      - level: 4
        where: ソマリアとの国境地帯
        display: ソマリアとの国境地帯
        border: {with: SOM, km: 20}
        note: 国境地帯の幹線道路等においては、ASが路上に設置した即席爆発装置（IED）により、治安機関だけでなく民間車両も被害を受けるテロ事件が頻発しています
        label_at: [42.45, 1.0]
        say: "ソマリアとの、国境地帯は、レベル4。退避してください。"
      - level: 4
        where: 北東部地域ガリッサ郡ダダーブ難民キャンプ周辺地域及びガリッサ
        display: ダダーブ難民キャンプ周辺とガリッサ
        bands:
          - [[40.31, 0.06]]
          - [[39.65, -0.45]]
        radius_km: 30
        label_at: [42.45, -1.0]
        say: "ダダーブ難民キャンプの周辺と、ガリッサも、レベル4です。"
      - level: 3
        where: 北東部地域マンデラ郡及びワジル郡（ソマリアとの国境地帯を除く）、ガリッサ郡（ソマリアとの国境地帯、ダダーブ難民キャンプ周辺地域及びガリッサを除く）、沿岸地域ラム郡
        display: 北東部地域とラム郡
        provinces: ["North-Eastern"]
        bands:
          - [[40.9, -2.1]]
        radius_km: 55
        label_at: [42.45, 3.0]
        say: "北東部地域の、ほとんどと、ラム郡は、レベル3です。"
      - level: 3
        where: リフトバレー地域トゥルカナ郡の南スーダン及びウガンダとの国境地帯並びに南部一帯、ウェスト・ポコット郡、バリンゴ郡北部一帯
        display: トゥルカナ郡南部・ウェスト・ポコット郡ほか
        bands:
          - [[35.65, 2.40]]
          - [[35.2, 1.5]]
          - [[36.0, 1.1]]
          - [[34.35, 4.2]]
        radius_km: 45
        label_at: [33.0, 2.6]
        note: 部族間で武力衝突が頻繁に発生しており
        say: "トゥルカナ郡の、南部と、ウェスト・ポコット郡も、レベル3です。部族間の、武力衝突が、頻繁に起きています。"
      - level: 2
        where: リフトバレー地域トゥルカナ郡（南スーダン及びウガンダとの国境地帯並びに南部一帯を除く）及びサンブル郡
        display: トゥルカナ郡の北〜中部・サンブル郡ほか
        bands:
          - [[36.72, 2.75]]
          - [[37.0, 1.2]]
        radius_km: 50
        label_at: [33.0, 0.0]
        say: "トゥルカナ湖の、まわりなどは、レベル2です。"
      - level: 1
        where: その他の地域
        display: その他の地域（モンバサなど）
        place_note: モンバサは、この中です
        say: "モンバサは、レベル1です。ただし、ラム郡からは、遠くありません。"
    why:
      - tag: テロ
        text: ケニア全土で、テロ・誘拐・一般犯罪に注意
        evidence: ナイロビ市内を含めて、ケニア全土でテロ、誘拐、一般犯罪等に注意してください
      - tag: 誘拐
        text: 外国人を対象とした拉致事件も、たびたび発生
        evidence: 外国人を対象とした拉致事件も度々発生しています
      - tag: 犯罪
        text: 市街地では、銃を使う強盗が、地域・時間に関係なく発生
        evidence: 同集団による銃器を使用した強盗等の凶悪犯罪が地域・時間帯に関係なく発生し、日本人の被害も発生しています

