# ---------- ターンと結び ----------
turn:
  say: "でも、この人気の観光地は、外務省が出している、危険地帯と、隣り合わせなんです。"
  lines:
    - ["でも…", 130, red]
    - ["危険地帯と隣り合わせ", 64, white]

caution:
  head: 外務省は、こう伝えています
  say: "外務省は、ナイロビを含む、ケニア全土で、テロや誘拐、一般犯罪に、注意するよう、求めています。外国人を対象にした、拉致事件も、たびたび起きています。"

closing:
  say: "世界遺産の、すぐそばに、レベル3の地域が、あります。ラム旧市街は、レベル3の中、トゥルカナ湖は、レベル2、モンバサは、レベル1です。行く前に、外務省の最新の情報を、必ず確認してください。"
  lines:
    - ["隣り合わせの観光地帯", 58, white]
    - ["出発前に必ず確認", 54, yellow]

extra_credits:
