# ---------- 投稿用テキスト（post.md として自動生成） ----------
post:
  title: "【{asof}時点】危険と隣り合わせの観光地帯 ケニア編。ラム旧市街は、外務省のレベル3の中"
  description: >-
    ケニアの世界遺産、ラム旧市街、トゥルカナ湖、モンバサのジーザス要塞。
    外務省の危険情報では、ソマリアとの国境地帯・ダダーブ難民キャンプ周辺・ガリッサがレベル4（退避勧告）。北東部地域・ラム郡・トゥルカナ郡南部・ウェスト・ポコット郡などがレベル3（渡航中止勧告）。トゥルカナ郡の北〜中部などがレベル2、その他の地域（モンバサなど）はレベル1です。
    ラム旧市街はレベル3のラム郡の中、トゥルカナ湖からレベル3の地域までは約{zone3_km_1}km、モンバサからレベル3のラム郡までは約{zone3_km_2}km（地図上の概算）。
    外務省は、ナイロビ市内を含めケニア全土でテロ・誘拐・一般犯罪に注意するよう求め、外国人を対象にした拉致事件も度々発生していると伝えています。
    危険情報は国全体ではなく地域ごとに違います。地域と理由は、外務省の危険情報ページの記載を要約しました。渡航前には、必ず外務省の最新の情報を確認してください。
  pinned_comment: 次に見たい国は、どこですか？コメントで教えてください！
  hashtags: ["#危険と隣り合わせの観光地帯", "#ケニア", "#ラム旧市街", "#トゥルカナ湖", "#モンバサ", "#外務省", "#危険情報", "#海外旅行"]
