post:
  title: "【{asof}時点】危険と隣り合わせの観光地帯 エクアドル編。グアヤキルは、外務省のレベル2"
  description: >-
    エクアドルの人気の観光地、世界遺産のキト旧市街、赤道記念碑、最大の港町グアヤキル。
    外務省の危険情報では、カルチ県・エスメラルダス県北東部・スクンビオス県がレベル3（渡航中止勧告）。グアヤキル市・エスメラルダス県北部・トゥルカン市周辺がレベル2。上記とガラパゴス県を除く全土はレベル1です。
    キトからレベル3の地域までは約{zone3_km_0}km、赤道記念碑からは約{zone3_km_1}km（地図上の概算）。
