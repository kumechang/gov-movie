# 場所と危険情報の型（place_vs_risk）: 「危険と隣り合わせの観光地帯 エクアドル編」。
# 外務省の危険情報（エクアドル）: レベル3＝カルチ県・エスメラルダス県北東部・スクンビオス県（コロンビア国境の県）／レベル2＝グアヤキル市・エスメラルダス県北部・トゥルカン市周辺／レベル1＝上記とガラパゴス県を除く全土。
# 観光地として、キト旧市街（世界遺産。レベル1）・赤道記念碑（キトの北23km。レベル1）・グアヤキル（レベル2の市）を見せる。
# 県の境界は Natural Earth。「北東部地域」「北部地域」「市」は円で示す目安。
# 人気の根拠は ja / en の Wikipedia で照合し、写真は Commons のライセンスを確認する（src/facts.py）。
# 危険レベル・地域・理由の文言は、公式の危険情報ページの本文に出てくることを毎回自動で確かめる（src/mofa.py）。書き方は docs/THEME_SPEC.md「場所と危険情報」。

id: ecuador_place_risk
template: place_vs_risk

metric: 外務省の危険レベル
year: 2026
unit: レベル（1〜4）

source:
  name: 外務省 海外安全情報オープンデータ
  note: "（危険レベルは{asof}時点）"
  table: 海外安全情報オープンデータ 国別（country/0593.xml）と、エクアドルの危険情報ページ
  url: https://www.ezairyu.mofa.go.jp/html/opendata/index.html
  license:
    checked: 2026-10-13
    terms_url: https://www.ezairyu.mofa.go.jp/html/opendata/support/terms.html
    commercial: true
    credit_lines:
      - 外務省 海外安全情報オープンデータ 提供情報（https://www.ezairyu.mofa.go.jp/html/opendata/index.html）を加工して作成
      - 出典：外務省 海外安全情報オープンデータ（https://www.ezairyu.mofa.go.jp/html/opendata/index.html）（{asof}に利用）
      - 地域・危険の理由の文言：外務省 海外安全ホームページ エクアドルの危険情報（https://www.anzen.mofa.go.jp/）を要約
  fetch: mofa_risk

verification: >-
  危険レベルは外務省の国別XML（country/0593.xml）の値を、公式の危険情報ページ本文と照合して使う。
  画面の地域（レベル3: カルチ県・エスメラルダス県北東部・スクンビオス県／レベル2: グアヤキル市・エスメラルダス県北部・トゥルカン市周辺／レベル1: 上記とガラパゴス県を除く全土）は、公式ページの「危険レベル」の節にその文言が出てきて、直後のレベル表示が一致することを毎回自動で確かめる。
  地図の範囲は概算: カルチ県・スクンビオス県は Natural Earth の県境（トゥルカン市は半径10kmの穴）。エスメラルダス県北東部、グアヤキル市、エスメラルダス市周辺は円（目安）。
  観光地からレベル3の地域までの距離は、座標とこの図形からの概算（5km単位）。
  地域の注記と注意点の文言は、公式ページの本文にそのまま出てくることを確かめる。
  観光地の根拠は、ja / en の Wikipedia の本文で確かめる（同じ Wikipedia の別言語版なので、独立した2系統とは言えない）。
  写真は Wikimedia Commons でライセンス（CC0 / パブリックドメイン / CC BY / CC BY-SA）と作者を確認し、画面と概要欄に出典を載せる。結果は build/ecuador_place_risk/fetch_report.txt。

mofa:
  max_age_hours: 24


