# ---------- 画面の固定文言 ----------
title: 危険と隣り合わせの観光地帯
title_small: エクアドル編｜外務省の危険情報と見比べる
subtitle: "魅力と、危険情報の地域（{asof}時点）"
footnote: "危険情報の最終更新：{risk_date}｜地図の位置・範囲はおおよそです"

# 地図: エクアドル北部〜中部（キト・グアヤキル・コロンビア国境）を見せる（bbox = [経度の最小, 緯度の最小, 経度の最大, 緯度の最大]）
map:
  bbox: [-81.0, -3.2, -76.2, 1.6]


# ---------- 対象の国と、地図に出す地域 ----------
members:
  - code: "0593"
    label: エクアドル
    iso: ECU
    regions:
      - level: 3
        where: カルチ県（トゥルカン市とパン・アメリカン・ハイウェイ付近を除く）、エスメラルダス県北東部地域（サン・ロレンソ市及びエロイ・アルファロ市）、スクンビオス県（南部ナポ川周辺の一部地域を除く）
        display: カルチ県・エスメラルダス県北東部・スクンビオス県
        provinces: [Carchi, Sucumbios]
        holes:
          - [-77.72, 0.81, 10]
        bands:
          - [[-78.8, 1.1]]
        radius_km: 35
        label_at: [-80.4, 1.2]
        note: 殺人・誘拐事件等の凶悪犯罪や薬物・武器の密輸等の増加が問題となっています
        say: "コロンビアと、国境を接する、カルチ県と、スクンビオス県、エスメラルダス県の、北東部は、レベル3です。"
      - level: 2
        where: グアヤス県グアヤキル市、エスメラルダス県北部地域（エスメラスダス市及びリオベルデ市）、カルチ県（トゥルカン市とパン・アメリカン・ハイウェイ付近）
        display: グアヤキル市・エスメラルダス県北部・トゥルカン市周辺
        bands:
          - [[-79.9, -2.17]]
          - [[-79.65, 0.97]]
          - [[-77.72, 0.81]]
        radius_km: 20
        label_at: [-80.5, -1.2]
        note: 麻薬関連の犯罪組織が活発で、殺人・爆弾事案等の凶悪事件が頻繁に発生し
        say: "グアヤキル市と、エスメラルダス県の北部、トゥルカン市の周辺は、レベル2です。"
      - level: 1
        where: 上記及びガラパゴス県を除く全土
        display: 上記とガラパゴス県を除く全土
        place_note: キトと、赤道記念碑は、この中です
        say: "キトと、赤道記念碑を含む、上記とガラパゴス県を除く、全土は、レベル1です。"
    why:
      - tag: 犯罪
        text: グアヤキルでは、殺人・爆弾事案などの凶悪事件が頻発
        evidence: 殺人・爆弾事案等の凶悪事件が頻繁に発生し
      - tag: 国境
        text: コロンビア国境の県では、誘拐・密輸が増加
        evidence: 殺人・誘拐事件等の凶悪犯罪や薬物・武器の密輸等の増加が問題となっています
      - tag: デモ
        text: 大規模な交通ストやデモで、道路封鎖・暴動も
        evidence: エクアドル全土で大規模な交通ストやデモ等の抗議活動が行われました

# 人気の場所（地図に印を出す。座標は Wikipedia の位置。概算）。
places:
  - {name: キト, marker: [-78.5249, -0.2295], region: 上記及びガラパゴス県を除く全土, side: right}
  - {name: 赤道記念碑, marker: [-78.4559, -0.0023], region: 上記及びガラパゴス県を除く全土, side: above-right}
  - {name: グアヤキル, marker: [-79.9, -2.17], in_region: グアヤス県グアヤキル市、エスメラルダス県北部地域（エスメラスダス市及びリオベルデ市）、カルチ県（トゥルカン市とパン・アメリカン・ハイウェイ付近）, side: above-right}

# ---------- 魅力の紹介（根拠は ja / en の Wikipedia で照合。photo.file は Commons のファイル名） ----------
scenes:
  - kind: wikipedia
    tag: 世界遺産
    place: キト
    name: キト
    headline: キト
    lines: ["標高2,850mの高地にある首都", "坂道に古い建物が並ぶ旧市街は、世界遺産", "レベル3の地域まで 約{zone3_km_0}km（地図上の概算）"]
    wikipedia:
      - {lang: ja, title: キト, contains: [世界遺産, 赤道]}
      - {lang: en, title: Quito, contains: [UNESCO]}
    source_line: 出典：ja / en Wikipedia で確認
    photo: {file: "PHOTO_QUITO"}
    min: 8.0
    say: "まず、キト。標高二千八百五十メートルの、高地にある、首都です。坂道に、古い建物が並ぶ、旧市街は、世界遺産です。レベル3の地域まで、約{zone3_km_0}キロです。"
  - kind: wikipedia
    tag: 赤道
    place: 赤道記念碑
    name: 赤道記念碑
    headline: 赤道記念碑
    lines: ["キトの北23kmにある、ミタード・デル・ムンド", "線で赤道が示されているが、実際とは誤差がある", "レベル3の地域まで 約{zone3_km_1}km（地図上の概算）"]
    wikipedia:
      - {lang: ja, title: キト, contains: [赤道記念碑, 23km, 誤差]}
      - {lang: en, title: Mitad del Mundo, contains: [Quito]}
    source_line: 出典：ja / en Wikipedia で確認
    photo: {file: "PHOTO_EQUATOR"}
    min: 8.0
    say: "次に、赤道記念碑。キトの北、二十三キロの、ミタード・デル・ムンドです。線で、赤道が示されていますが、実際の赤道とは、誤差があります。レベル3の地域まで、約{zone3_km_1}キロです。"
  - kind: wikipedia
    tag: 港町
    place: グアヤキル
    name: グアヤキル
    headline: グアヤキル
    lines: ["エクアドル最大の都市で、最大の港湾都市", "でも、この市は、レベル2", "麻薬関連の犯罪組織が活発で、凶悪事件が頻発"]
    wikipedia:
      - {lang: ja, title: グアヤキル, contains: [最大の都市, 最大の港湾都市]}
      - {lang: en, title: Guayaquil, contains: [largest]}
    source_line: 出典：ja / en Wikipedia で確認（外務省の文言は公式ページ）
    photo: {file: "PHOTO_GUAYAQUIL"}
    min: 7.5
    say: "そして、グアヤキル。エクアドル最大の、都市で、最大の、港湾都市です。でも、この市は、レベル2です。麻薬関連の、犯罪組織が活発で、凶悪事件が、頻繁に、発生しています。"

# ---------- ターンと結び ----------
turn:
  say: "でも、この人気の観光地は、外務省が出している、危険地帯と、隣り合わせなんです。"
  lines:
    - ["でも…", 130, red]
    - ["危険地帯と隣り合わせ", 64, white]

caution:
  head: 外務省は、こう伝えています
  say: "外務省は、グアヤキル市では、麻薬関連の、犯罪組織が活発で、殺人や爆弾事案などの、凶悪事件が、頻繁に発生していると、伝えています。コロンビア国境の県では、誘拐や、密輸の増加も、問題になっています。"

closing:
  say: "人気の観光地の、近くに、レベル3の地域が、あります。キトと、赤道記念碑は、レベル1、グアヤキルは、レベル2です。行く前に、外務省の最新の情報を、必ず確認してください。"
  lines:
    - ["隣り合わせの観光地帯", 58, white]
    - ["出発前に必ず確認", 54, yellow]

extra_credits:
  - "人気の根拠：ja / en Wikipedia で確認"


